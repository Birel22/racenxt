# Link previews: when someone shares an athlete's Race Hub (WhatsApp, iMessage...), the message shows
# a picture with the athlete's photo, logo and "<FIRST> RACE HUB". This builds docs/<slug>/ for every
# published page, every 15 minutes and whenever the fan page changes.
name: Link previews
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/404.html", "tools/previews.py", ".github/workflows/previews.yml"]
permissions:
  contents: write
concurrency:
  group: previews
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          pip install pillow
          mkdir -p /tmp/fonts
          for f in BarlowCondensed-Bold BarlowCondensed-Medium; do
            curl -fsSL -o /tmp/fonts/$f.ttf https://github.com/google/fonts/raw/main/ofl/barlowcondensed/$f.ttf
          done
      - name: Build previews
        run: python3 tools/previews.py
      - name: Save
        run: |
          git config user.name "racenxt-bot"
          git config user.email "racenxt-bot@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Link previews updated"
          git pull --rebase -q origin main
          git push -q origin main
