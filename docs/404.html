<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Hub</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Race Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0e11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e11; --panel:#16181d; --panel2:#1c1f25; --line:#2a2d35;
    --text:#f2f2ef; --muted:#9a9ca3; --dim:#6c6f77;
    --imsa:#e8352f; --elms:#f2d30f; --lm:#ff9a1f; --alms:#5fcf6e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:40px 20px 64px}

  .hero{position:relative;border-radius:16px;overflow:hidden;min-height:440px;display:flex;align-items:flex-end;margin-bottom:22px;background:#111}
  .hero .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 40%}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,14,17,.92) 0%,rgba(13,14,17,.55) 45%,rgba(13,14,17,0) 75%),linear-gradient(0deg,rgba(13,14,17,.85) 0%,rgba(13,14,17,0) 45%)}
  .hero-text{position:relative;z-index:1;padding:28px}
  .logo{position:absolute;top:24px;left:28px;z-index:1;width:calc(150px * var(--lgs,1));max-width:45%;height:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
  .partners{display:flex;align-items:center;justify-content:center;gap:clamp(24px,6vw,56px);padding:18px 16px;margin-bottom:6px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .partners span{font:600 12px 'Barlow Condensed';letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .partners img{display:block;width:auto;opacity:.85;transition:opacity .15s}
  .partners a{display:block;padding:6px;border-radius:6px}
  .partners a:hover img{opacity:1}
  .partners a:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .partners .p-cad{height:40px} .partners .p-cnx{height:22px} .partners .p-ao{height:34px}
  .socials{display:flex;gap:6px}
  .socials a{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:var(--text);opacity:.85;transition:opacity .15s,background .15s}
  .socials a:hover{opacity:1;background:rgba(255,255,255,.12)}
  .socials a:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .socials svg{width:18px;height:18px}
  .hero .socials{margin-top:16px;gap:8px}
  .hero .socials a{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);opacity:1}
  .hero .socials a:hover{background:rgba(255,255,255,.22)}
  footer .socials a{color:var(--muted)}
  .lang{position:absolute;top:20px;right:20px;z-index:2;display:flex;background:rgba(13,14,17,.65);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .lang button{font:700 13px 'Barlow Condensed';letter-spacing:.12em;color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
  .lang button:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .car-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:30px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
  .car-btn:hover{color:var(--text);border-color:#4a4d56}
  .car-btn:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .car-btn svg{width:28px;height:28px;flex:none}
  .car-btn{color:#b9bcc3 !important}
  .car-lbl{display:none;font:600 13px 'Barlow',sans-serif;margin-left:6px}
  @media (min-width:621px){ .car-btn{width:auto;padding:0 12px 0 9px} .car-lbl{display:inline} }
  .country-row{gap:10px !important}
  .country{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .country-row > button{flex:none}
  .car-img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;margin:2px 0 14px;background:var(--panel2)}
  .car-specs{margin-bottom:22px}
  .spec{display:grid;grid-template-columns:38% 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35}
  .spec span:first-child{color:var(--muted)}
  .ev.past{opacity:.42;filter:grayscale(.7);transition:opacity .2s}
  .ev.past:hover{opacity:.75}
  .partners-foot{margin:34px 0 0}
  .live-badge{display:inline-flex;align-items:center;gap:6px;font:800 12px 'Barlow',sans-serif;letter-spacing:.08em;color:#fff;background:#e5322d;border-radius:5px;padding:3px 7px;margin-right:10px;vertical-align:4px}
  .live-badge i{width:7px;height:7px;border-radius:50%;background:#fff;animation:live-pulse 1.2s ease-in-out infinite}
  .live-badge.sm{font-size:10px;padding:2px 6px;margin-right:7px;vertical-align:1px}
  @keyframes live-pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){.live-badge i{animation:none}}
  .live-line{display:flex !important;align-items:center;flex-wrap:wrap}
  .cd-sub{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
  .cd-label .cd-ses{display:inline;font:600 14px 'Barlow',sans-serif;letter-spacing:0;text-transform:none;color:var(--text);margin:0;line-height:inherit}
  .cd-label .live-badge{color:#fff;font-size:12px}
  .cd-label .cd-sub, .cd-label .cd-sub *{text-transform:none}
  body:has(#tt:not([hidden])) .page-cue{display:none}
  .cd-yt{color:var(--dim);font-size:12px}
  .tt-row.done{opacity:.38}
  .tt-row.done span:first-child{text-decoration:line-through;text-decoration-thickness:1px}
  .tt-row.is-live{background:rgba(229,50,45,.08);border-radius:8px;margin:0 -8px;padding-left:8px;padding-right:8px}
  .demo-badge{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:60;background:#f2d30f;color:#111;font:800 11px 'Barlow',sans-serif;letter-spacing:.1em;padding:4px 10px;border-radius:999px;pointer-events:none}
  .ev{position:relative}
  .share-btn{position:absolute;top:10px;right:10px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:0;background:none;color:var(--dim);cursor:pointer;transition:color .15s,background .15s;z-index:1}
  .share-btn:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .share-btn:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .share-btn svg{width:16px;height:16px}
  .ev .name{padding-right:26px}
  .ev.flash{box-shadow:0 0 0 2px var(--c);transition:box-shadow .3s}
  #toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);font:600 14px 'Barlow',sans-serif;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .carno{display:inline-flex;align-items:center;font:700 12px 'Barlow',sans-serif;letter-spacing:.02em;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:8px;vertical-align:3px;text-transform:none}
  .team-box{display:flex;align-items:center;gap:14px;padding:12px 14px;margin:0 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .team-num{font:800 28px 'Barlow Condensed';line-height:1;color:var(--text);min-width:52px;text-align:center}
  .team-box b{display:block;font:600 15px 'Barlow',sans-serif}
  .team-box span:not(.team-num){display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
  .page-cue{position:fixed;left:50%;bottom:calc(2px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(calc((1 - var(--pc,1)) * 12px));opacity:var(--pc,1);display:flex;align-items:center;gap:6px;font:600 13px 'Barlow',sans-serif;color:var(--text);background:rgba(28,31,37,.9);border:1px solid #3a3d45;border-radius:999px;padding:7px 14px 7px 11px;pointer-events:none;z-index:40;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.4);transition:opacity .12s linear,transform .12s linear}
  .page-cue svg{width:14px;height:14px;animation:cue-bob 1.6s ease-in-out infinite}
  .page-cue.gone{display:none}
  .chip-lm{height:14px;width:auto;display:block}
  .lm24{display:inline-flex;align-items:center;justify-content:center;font:800 10px 'Barlow Condensed';letter-spacing:0;background:var(--lm);color:#1a1206;border-radius:4px;height:18px;padding:0 4px}
  header{position:relative;padding-bottom:0;margin-bottom:18px}
  .stripe{display:flex;gap:6px;margin-bottom:22px}
  .stripe span{height:4px;width:44px;border-radius:2px}
  .eyebrow{font-family:'Barlow Condensed';font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-size:14px}
  h1{font-family:'Barlow Condensed';font-weight:800;font-size:clamp(44px,9vw,76px);line-height:.95;text-transform:uppercase;margin:6px 0 10px;letter-spacing:.01em}
  h1 em{font-style:normal;color:var(--lm)}
  .sub{color:var(--muted);font-size:16px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px}
  .stat b{display:block;font-family:'Barlow Condensed';font-size:34px;font-weight:700;line-height:1}
  .stat small{color:var(--muted);font-size:13px}

  .filter-dd{position:sticky;top:8px;z-index:20;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .season-prog{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding:4px 10px;border-radius:10px;background:rgba(13,14,17,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .season-prog b{font:600 12px 'Barlow',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .season-prog b span{color:var(--dim)}
  .season-prog i{display:block;width:76px;height:3px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
  .season-prog i::after{content:"";position:absolute;inset:0 auto 0 0;width:max(var(--p), 4px);background:var(--text);border-radius:2px}
  .ff-btn{max-width:100%;display:inline-flex;align-items:center;gap:8px;font:inherit;color:var(--text);background:rgba(13,14,17,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px 10px 6px 12px;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s}
  .ff-btn:hover,.ff-btn[aria-expanded="true"]{border-color:#4a4d56}
  .ff-btn[aria-expanded="true"]{box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .ff-btn:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .ff-pre{flex:none;font:600 10px 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding-right:8px;border-right:1px solid var(--line)}
  .ff-cur{min-width:0;display:flex;align-items:center;gap:8px}
  .ff-name{font:600 13.5px 'Barlow',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ff-menu .ff-name{font-size:15px}
  .ff-logo{flex:none;width:58px;height:22px;display:flex;align-items:center;justify-content:center}
  .ff-cur .ff-logo{width:42px;height:16px}
  .ff-cur .ff-logo .ff-all{width:15px;height:15px}
  .ff-cur .ff-logo:has(.ff-all){width:16px}
  .ff-logo img{max-width:100%;max-height:100%;object-fit:contain}
  .ff-logo .ff-all{width:20px;height:20px;color:var(--muted)}
  .ff-chev{flex:none;width:15px;height:15px;color:var(--muted);transition:transform .15s}
  .ff-btn[aria-expanded="true"] .ff-chev{transform:rotate(180deg)}
  .ff-menu{position:absolute;top:calc(100% + 6px);left:0;width:min(100%, 380px);list-style:none;margin:0;padding:6px;background:var(--panel2);border:1px solid #3a3d45;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
  .ff-menu[hidden]{display:none}
  .ff-menu li{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:8px;cursor:pointer;color:var(--muted);outline:none}
  .ff-menu li:hover,.ff-menu li:focus{background:rgba(255,255,255,.06);color:var(--text)}
  .ff-menu li[aria-selected="true"]{color:var(--text);background:rgba(255,255,255,.04)}
  .ff-menu li[aria-selected="true"]::after{content:"";flex:none;margin-left:auto;width:6px;height:11px;border:solid var(--text);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-2px,-2px)}
  .ff-menu .ff-name{flex:1;min-width:0}
  @media (prefers-reduced-motion: reduce){.ff-chev{transition:none}}

  .month{display:grid;grid-template-columns:92px 1fr;gap:16px;margin-bottom:18px}
  .month h2{font:600 12px 'Barlow',sans-serif;text-transform:uppercase;letter-spacing:.2em;color:var(--dim);padding-top:18px;position:sticky;top:56px;align-self:start}
  .events{display:flex;flex-direction:column;gap:10px}

  .ev{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:14px 16px}
  .ev.alms{--c:var(--alms)} .ev.imsa{--c:var(--imsa)} .ev.elms{--c:var(--elms)} .ev.lm{--c:var(--lm)}
  .date{font-family:'Barlow Condensed';text-transform:uppercase;line-height:1}
  .date b{display:block;font-size:26px;font-weight:700;white-space:nowrap}
  .date small{font-size:13px;color:var(--muted);letter-spacing:.08em;font-weight:600}
  .name{font-family:'Barlow Condensed';font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
  .where{color:var(--muted);font-size:14.5px;margin-top:3px}
  a.where{display:block;text-decoration:none;color:var(--muted);transition:color .15s}
  a.where:hover{color:var(--text);text-decoration:underline;text-underline-offset:3px}
  a.where:focus-visible{outline:2px solid var(--lm);outline-offset:2px;border-radius:3px}
  .pin{width:12px;height:12px;vertical-align:-1px;margin-right:4px;opacity:.7}
  .country-row{display:flex;align-items:center;gap:14px;margin-top:6px}
  .country-row .country{margin-top:0}
  .tt-btn{display:inline-flex;align-items:center;gap:5px;font:600 13px 'Barlow',sans-serif;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;transition:color .15s,border-color .15s}
  .tt-btn:hover{color:var(--text);border-color:#4a4d56}
  .tt-btn:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .tt-btn svg{width:12px;height:12px}
  .tt-btn.has{color:var(--text);border-color:#4a4d56}
  #tt{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overscroll-behavior:contain}
  #tt[hidden]{display:none!important}
  .tt-modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:440px;max-height:85vh;max-height:85dvh;display:flex;flex-direction:column;overflow:hidden}
  .tt-hd{flex:none;display:flex;align-items:flex-start;gap:10px;padding:16px 14px 10px 20px;border-bottom:1px solid var(--line)}
  #tt-hdc{flex:1;min-width:0}
  .tt-hd .tt-head{margin-bottom:0}
  .tt-hd .tt-head h3{font-size:24px;margin:0}
  .tt-hd .tt-head small{display:block;margin-top:2px;letter-spacing:.06em}
  .tt-modebar{display:flex;align-items:center;gap:10px;margin-top:10px}
  .tt-modebar .tt-mode{margin:0}
  .tt-mode button{font-size:12px !important;padding:4px 10px !important}
  .tt-off{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  #tt-close{flex:none}
  #tt-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:12px 20px var(--ft-h,0px);scrollbar-width:thin}
  #tt-body > :last-child{margin-bottom:22px}
  #tt-ft{position:absolute;left:0;right:0;bottom:0;z-index:3;display:none;padding:34px 20px 16px;background:linear-gradient(to bottom,rgba(22,24,29,0) 0,rgba(22,24,29,.92) 30px,var(--panel) 46px);pointer-events:none;border-bottom-left-radius:14px;border-bottom-right-radius:14px}
  #tt-ft > *{pointer-events:auto}
  #tt-ft .pick-bar{margin:0 0 8px}
  #tt-ft .cal-all{box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .tt-modal.selecting #tt-ft{display:block}
  .tt-modal.selecting .tt-note,.tt-modal.selecting .tt-link{display:none}

  .scroll-fade{position:absolute;left:0;right:0;bottom:var(--cue-b,0px);height:56px;background:linear-gradient(to bottom,rgba(22,24,29,0),var(--panel));pointer-events:none;opacity:0;transition:opacity .2s}
  .scroll-cue{position:absolute;left:50%;bottom:calc(var(--cue-b,0px) + 10px);transform:translateX(-50%);display:flex;align-items:center;gap:6px;font:600 12px 'Barlow',sans-serif;color:var(--text);background:rgba(28,31,37,.92);border:1px solid #3a3d45;border-radius:999px;padding:6px 12px 6px 10px;opacity:0;pointer-events:none;transition:opacity .12s linear,transform .12s linear;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .scroll-cue svg{width:14px;height:14px;animation:cue-bob 1.6s ease-in-out infinite}
  .tt-modal.has-more .scroll-fade{opacity:var(--cue-k,1)}
  .tt-modal.selecting .scroll-fade{display:none}
  .tt-modal.has-more .scroll-cue{opacity:var(--cue-k,1);transform:translateX(-50%) translateY(calc((1 - var(--cue-k,1)) * 10px))}
  .tt-modal:not(.selecting) #tt-body{padding-bottom:0}
  @keyframes cue-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
  @media (prefers-reduced-motion: reduce){.scroll-cue svg{animation:none}}
  #tt-close{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:18px;cursor:pointer}
  #tt-close:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .tt-head{border-left:4px solid var(--c);padding-left:12px;margin-bottom:14px}
  .tt-head.imsa{--c:var(--imsa)} .tt-head.elms{--c:var(--elms)} .tt-head.alms{--c:var(--alms)} .tt-head.lm{--c:var(--lm)}
  .tt-head small{font:600 12px 'Barlow Condensed';letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tt-head h3{font:700 26px 'Barlow Condensed';text-transform:uppercase;line-height:1.1;margin:2px 0}
  .tt-head span{color:var(--muted);font-size:14px}
  .tt-tz{font-size:13px;color:var(--dim);margin-bottom:10px}
  .tt-day{margin-bottom:14px}
  .tt-day b{display:block;font:700 15px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .tt-row{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
  .tt-row span:first-child{font-variant-numeric:tabular-nums;font-weight:600}
  .tt-mode{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:10px}
  .tt-mode button{font:600 13px 'Barlow',sans-serif;color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
  .tt-mode button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
  .tt-mode button:focus-visible,.cal-add:focus-visible,.cal-all:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .tt-row{grid-template-columns:56px 1fr 30px !important;align-items:center}
  .tt-row.pick{cursor:pointer;position:relative}
  .tt-row.pick input{position:absolute;opacity:0;width:1px;height:1px}
  .tt-row .box{width:22px;height:22px;border-radius:6px;border:1.5px solid #555963;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}

// Where to watch
const WATCH = RNX.watch, TV = RNX.tv || {};
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15l13-7.5z"/></svg>';
const W_ICON = {
  stream: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path fill="currentColor" d="M10 8.3v7.4l6.2-3.7z"/></svg>',
  tv: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.8" y="6" width="18.4" height="12.4" rx="2.4"/><path d="M8.5 21h7M9 2.8l3 3.2 3-3.2"/></svg>',
  out: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  x: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch(e){ return ""; } };
// Where to watch: the championship's Official stream + TV broadcast (this race's own page if it has one, else the channels by country)
const LKI = {
  link: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  timing: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4M12 2v3"/></svg>',
  ticket: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/></svg>'
};
const lkIcon = l => { const t = (l || "").toLowerCase(); return /watch|stream|tv|broadcast|live$/.test(t) ? W_ICON.stream : /timing|tracker/.test(t) ? LKI.timing : /ticket/.test(t) ? LKI.ticket : LKI.link; };
// the small link icon on a custom event's card: opens its links in the same popup
const linkBtn = ev => ev.links && ev.links.length ? `<button type="button" class="lk-btn wbtn" data-i="${EVENTS.indexOf(ev)}" aria-haspopup="dialog" aria-label="${T("wLinks")} – ${esc0(L(ev.name))}" title="${T("wLinks")}">${LKI.link}</button>` : "";
function watchLinks(ev){
  const st = WATCH[ev.series] || "", tv = ev.watch || TV[ev.series] || "";
  if (!st && !tv) return ev.links && ev.links.length ? `<button type="button" class="watch wbtn" data-i="${EVENTS.indexOf(ev)}" aria-haspopup="dialog">${LKI.link}${T("wLinks")}</button>` : "";
  return `<button type="button" class="watch wbtn" data-i="${EVENTS.indexOf(ev)}" aria-haspopup="dialog">${PLAY}${T("watch")}</button>`;
}
let wLast = null;
function openWatch(ev, from){
  const st = WATCH[ev.series] || "", tv = ev.watch || TV[ev.series] || "";
  const row = (href, icon, title, sub) => `<a class="ws-row" href="${esc0(href)}" target="_blank" rel="noopener"><span class="ws-ic">${W_ICON[icon]}</span><span class="ws-t"><b>${title}</b><small>${esc0(sub)}</small></span><span class="ws-go">${W_ICON.out}</span></a>`;
  const el = document.createElement("div");
  el.className = "ws"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-labelledby", "ws-h");
  el.style.setProperty("--c", (RNX.color && RNX.color[ev.series]) || "#ff6a1f");
  el.innerHTML = `<div class="ws-back" data-close></div><div class="ws-card"><span class="ws-grab" aria-hidden="true"></span>
    <div class="ws-head"><div><small>${st || tv ? T("wTitle") : T("wLinks")}</small><h3 id="ws-h">${esc0(L(ev.name))}</h3></div><button type="button" class="ws-x" data-close aria-label="${T("wClose")}">${W_ICON.x}</button></div>
    <div class="ws-list">${st ? row(st, "stream", T("wStream"), hostOf(st)) : ""}${tv ? row(tv, "tv", T("wTv"), ev.watch ? T("wSubRace") : T("wSubAll")) : ""}${(ev.links || []).map(l => `<a class="ws-row" href="${esc0(l.url)}" target="_blank" rel="noopener"><span class="ws-ic">${lkIcon(l.label)}</span><span class="ws-t"><b>${esc0(l.label)}</b><small>${esc0(hostOf(l.url))}</small></span><span class="ws-go">${W_ICON.out}</span></a>`).join("")}</div>
    ${st || tv ? `<p class="ws-note">${T("wOpens")}</p>` : ""}</div>`;
  document.body.appendChild(el);
  wLast = from || null;
  document.documentElement.classList.add("ws-lock");
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
  el.querySelector(".ws-row, .ws-x").focus({ preventScroll: true });
  const close = () => { el.classList.remove("on"); document.documentElement.classList.remove("ws-lock"); document.removeEventListener("keydown", key, true); setTimeout(() => el.remove(), 320); if (wLast) wLast.focus({ preventScroll: true }); };
  const key = e => {
    if (e.key === "Escape"){ e.stopPropagation(); close(); }
    if (e.key === "Tab"){ const f = [...el.querySelectorAll("a,button")]; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); } }
  };
  document.addEventListener("keydown", key, true);
  el.addEventListener("click", e => { if (e.target.closest("[data-close]")) close(); else if (e.target.closest(".ws-row")) setTimeout(close, 150); });
  // swipe down to close on phones
  const card = el.querySelector(".ws-card"); let y0 = null, dy = 0;
  card.addEventListener("touchstart", e => { if (card.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; card.style.transition = "none"; } }, { passive: true });
  card.addEventListener("touchmove", e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); card.style.transform = `translateY(${dy}px)`; }, { passive: true });
  card.addEventListener("touchend", () => { if (y0 == null) return; card.style.transition = ""; card.style.transform = ""; if (dy > 90) close(); y0 = null; });
}
document.addEventListener("click", e => { const b = e.target.closest(".wbtn"); if (b) openWatch(EVENTS[+b.dataset.i], b); });
const watchBtn = ev => `<button class="share-btn cd-share" data-i="${EVENTS.indexOf(ev)}" aria-label="${T("share")} – ${esc(L(ev.name))}" title="${T("share")}">${SHAREICON}</button><div class="cd-btns"><button class="watch ghost cd-tt" data-i="${EVENTS.indexOf(ev)}">${TTICON}${T("schedule")}</button>${CARS[CAR_OF[ev.carKey || ev.series]] ? `<button class="watch ghost cd-car" data-series="${ev.carKey || ev.series}" aria-label="${T("carSpecs")} – ${esc(CARS[CAR_OF[ev.carKey || ev.series]].name)}">${carIc(ev.carKey || ev.series)}${T("carShort")}</button>` : ""}${watchLinks(ev)}</div>`;

// Countdown
// ===== Horloge (avec mode démo : ?demo=pre | next | live | between | race) =====
const DEMO = (() => { try { return new URLSearchParams(location.search).get("demo"); } catch(e){ return null; } })();
const DEMO_BASE = (() => {
  const J = id => TIMETABLES[id] && TIMETABLES[id].sessions;
  const ses = J("jerez"); if (!DEMO || !ses) return null;
  const at = (i, plusMin) => new Date(new Date(ses[i].utc).getTime() + plusMin*60000);
  return {pre: at(0, -2*24*60 - 5*60), next: at(0, -95), live: at(0, 20), between: at(0, 100), race: at(6, 75)}[DEMO] || null;
})();
const LOAD_T = Date.now();
const NOW = () => DEMO_BASE ? new Date(DEMO_BASE.getTime() + (Date.now() - LOAD_T)) : new Date();
const sesStart = s => new Date(s.utc), sesEnd = s => new Date(new Date(s.utc).getTime() + s.min*60000);
function evDone(ev, now){
  const t = TIMETABLES[ev.id];
  if (t) return now >= sesEnd(t.sessions[t.sessions.length-1]);
  return now >= new Date(d(ev.e).getTime() + 86400000);
}
function sessionState(ev, now){
  const t = TIMETABLES[ev.id]; if (!t) return null;
  const live = t.sessions.find(s => sesStart(s) <= now && now < sesEnd(s));
  const next = t.sessions.find(s => sesStart(s) > now);
  return {live, next};
}
const fmtLocal = dt => { let x = dt.toLocaleString(T("locale"), {weekday:"short", hour:"2-digit", minute:"2-digit", hourCycle:"h23"}); return x.charAt(0).toUpperCase()+x.slice(1); };
const fmtTime = dt => dt.toLocaleTimeString(T("locale"), {hour:"2-digit", minute:"2-digit", hourCycle:"h23"});
let cdKey = null;
function tick(){
  const now = NOW(), cd = document.getElementById("cd");
  const ev = EVENTS.find(e => !evDone(e, now));
  if (!ev){ const k = LANG+"end"; if (cdKey===k) return; cdKey=k; cd.className="countdown"; cd.innerHTML = `<div class="cd-label"><small>${T("season")}</small><b>${T("over")}</b></div>`; return; }
  const st = sessionState(ev, now);
  const p = n => String(n).padStart(2,"0");
  const sub = `${ev.flag} ${esc(L(ev.country))} · ${LABEL[ev.series]} · ${dateLabel(ev).big} ${dateLabel(ev).small}`;
  // 1) session en cours -> LIVE
  if (st && st.live){
    const k = LANG+"live"+ev.id+st.live.utc; if (cdKey === k) return; cdKey = k;
    cd.className = "countdown " + ev.series;
    cd.innerHTML = `<div class="cd-label"><small>${esc(L(ev.name))}</small><b class="live-line"><span class="live-badge"><i></i>LIVE</span>${esc(L(st.live.label))}</b><span>${sub}</span><span class="cd-sub">${T("endsAround")} ${fmtTime(sesEnd(st.live))}${st.next ? ` · ${T("then")} ${esc(L(st.next.label))} ${fmtLocal(sesStart(st.next))}` : ""}</span></div><div class="cd-right">${watchBtn(ev)}</div>`;
    return;
  }
  // 2) compte à rebours : vers la prochaine session si horaire connu, sinon vers le début du week-end
  const target = st && st.next ? sesStart(st.next) : d(ev.s);
  const inWeekend = now >= d(ev.s);
  if (!st && inWeekend){
    const k = LANG+"cur"+ev.id; if (cdKey === k) return; cdKey = k;
    cd.className = "countdown " + ev.series;
    cd.innerHTML = `<div class="cd-label"><small>${T("now")}</small><b>${esc(L(ev.name))}</b><span>${sub}</span></div><div class="cd-right"><b style="color:var(--c);font:700 26px 'Barlow Condensed';text-transform:uppercase">${T("racing")}</b>${watchBtn(ev)}</div>`;
    return;
  }
  let t = Math.max(0, target - now);
  const D = Math.floor(t/86400000); t%=86400000;
  const H = Math.floor(t/3600000); t%=3600000;
  const M = Math.floor(t/60000), Sx = Math.floor((t%60000)/1000);
  const key = LANG+"nxt"+ev.id+(st && st.next ? st.next.utc : "");
  if (cdKey === key){
    const set=(u,v)=>{const el=cd.querySelector(`[data-u="${u}"]`); if(el) el.textContent=v;};
    set("d",D); set("h",p(H)); set("m",p(M)); set("s",p(Sx)); return;
  }
  cdKey = key;
  const firstSession = st && st.next && TIMETABLES[ev.id].sessions[0] === st.next;
  const label = st && st.next ? (firstSession && !inWeekend ? T("nextRace") : T("nextSession")) : T("nextRace");
  const sesLine = st && st.next ? `<span class="cd-sub"><b class="cd-ses">${esc(L(st.next.label))}</b> — ${fmtLocal(sesStart(st.next))} <span class="cd-yt">(${T("yourTimeShort")})</span></span>` : "";
  cd.className = "countdown " + ev.series;
  cd.innerHTML = `<div class="cd-label"><small>${label}</small><b>${esc(L(ev.name))}</b><span>${sub}</span>${sesLine}</div>
    <div class="cd-right"><div class="cd-units"><div><b data-u="d">${D}</b><small>${T("days")}</small></div><div><b data-u="h">${p(H)}</b><small>${T("hours")}</small></div><div><b data-u="m">${p(M)}</b><small>${T("min")}</small></div><div><b data-u="s">${p(Sx)}</b><small>${T("sec")}</small></div></div>${watchBtn(ev)}</div>`;
}
// rafraîchir l'horaire ouvert chaque minute (sessions passées / live)
setInterval(() => { if (typeof ttOpenIdx === "number" && !document.getElementById("tt").hidden){ const keep=[...document.querySelectorAll("#tt-body .tt-pick:checked")].map(c=>c.dataset.k); const st=document.getElementById("tt-body").scrollTop; fillTT(ttOpenIdx); keep.forEach(k=>{const c=document.querySelector(`#tt-body .tt-pick[data-k="${k}"]`); if(c) c.checked=true;}); document.getElementById("tt-body").scrollTop=st; updatePickUI(); } }, 60000);
if (DEMO_BASE){ const b = document.createElement("div"); b.className = "demo-badge"; b.textContent = "DEMO · " + DEMO; document.body.appendChild(b); }

// Apply language
function applyLang(lang){
  LANG = lang;
  document.documentElement.lang = lang;
  document.title = T("docTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = T(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", T(el.dataset.i18nAria)); if (el.hasAttribute("title")) el.title = T(el.dataset.i18nAria); });
  document.querySelectorAll("[data-i18n-alt]").forEach(el => el.alt = T(el.dataset.i18nAlt));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===lang ? "true" : "false"));
  // the photo keeps its height when the language changes (French text is longer and would shrink it on phones)
  render(); ffSync(); cdKey = null; tick(); seasonProgress(); if (document.getElementById("page-cue") && !fitW) fitHero(true);
  if (ttOpenIdx === "sub") fillSub(); else if (typeof ttOpenIdx === "string" && ttOpenIdx.startsWith("car:")) fillCar(ttOpenIdx.slice(4)); else if (ttOpenIdx !== null) fillTT(ttOpenIdx);
  if (ttOpenIdx !== null) requestAnimationFrame(updateCue);
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  try { localStorage.setItem("lang", b.dataset.lang); } catch(e){}
  applyLang(b.dataset.lang);
}));
applyLang(LANG);
setInterval(tick, 1000); setInterval(seasonProgress, 60000);
setTimeout(focusHash, 300); window.addEventListener("hashchange", focusHash);
// Indice « More races » : visible à l'ouverture, s'estompe en défilant
function pageCue(){
  const cue = document.getElementById("page-cue"), list = document.getElementById("list");
  const listTop = list.getBoundingClientRect().top;
  const scrollable = document.documentElement.scrollHeight > window.innerHeight + 40;
  if (!scrollable || listTop < window.innerHeight * 0.55) { cue.style.setProperty("--pc", 0); }
  else { const k = Math.max(0, Math.min(1, 1 - window.scrollY / 140)); cue.style.setProperty("--pc", k.toFixed(3)); }
}
// Ajuste la hauteur de la photo pour que la prochaine course tienne pile au-dessus de l'indice « More races »
var fitW = 0;
function fitHero(force){
  const hero = document.querySelector(".hero"), cd = document.getElementById("cd"), cue = document.getElementById("page-cue");
  if (!hero || !cd) return;
  if (!force && window.innerWidth === fitW) return; // pas de saut quand la barre Safari bouge
  fitW = window.innerWidth;
  if (window.innerWidth > 620) { hero.style.minHeight = ""; return; }
  const below = cd.getBoundingClientRect().bottom - hero.getBoundingClientRect().bottom;
  const top = hero.getBoundingClientRect().top + window.scrollY;
  const cueSpace = (cue.offsetHeight || 32) + 2 + 10;
  // phones keep the tall photo: never less than about half the screen (on screens tall enough), whatever the language
  const floor = window.innerHeight >= 700 ? window.innerHeight * 0.52 : 200;
  const h = Math.round(Math.max(floor, Math.min(560, window.innerHeight - top - below - cueSpace)));
  hero.style.minHeight = h + "px";
  pageCue();
}
window.addEventListener("resize", () => fitHero(false));
window.addEventListener("load", () => fitHero(true));
if (document.fonts) document.fonts.ready.then(() => fitHero(true));
fitHero(true);
window.addEventListener("scroll", pageCue, {passive:true});
window.addEventListener("resize", pageCue);
pageCue();
})();
</script>
