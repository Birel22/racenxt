<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Racenxt Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<script src="config.js?v=20261123-212817"></script>
<script src="rnx-auth.js?v=20261123-212817"></script>
<style>
  :root{--bg:#0b0c0f;--side:#101115;--panel:#15161b;--panel2:#1b1c22;--line:#26282e;--line2:#33363d;--text:#f4f4f2;--dim:#a9abb2;--mute:#7d808a;--acc:#FF5A1F;--good:#5fcf6e;--warn:#f2b20f;--bad:#e8352f;--side-w:232px}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--text)}
  button,input,select,textarea{font:inherit;color:inherit}
  .brand{font:800 italic 24px 'Barlow Condensed',sans-serif;letter-spacing:-.5px;white-space:nowrap}
  .brand .x{background:linear-gradient(90deg,var(--acc) 50%,var(--text) 50%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-right:2px}
  .brand small{font:600 11px Barlow;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-style:normal;margin-left:6px}
  /* layout */
  .layout{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100%}
  aside{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px}
  aside .brand{padding:2px 10px 18px}
  aside nav{display:flex;flex-direction:column;gap:2px;flex:1}
  aside .grp{font:600 11px Barlow;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:14px 10px 6px;margin-top:10px;border-top:1px solid var(--line,#24262d)}
  aside a.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--dim);font-weight:500}
  aside a.nav svg{width:18px;height:18px;flex:none}
  aside a.nav:hover{background:var(--panel);color:var(--text)}
  aside a.nav.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--acc)}
  aside a.nav .badge{margin-left:auto;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:var(--acc);color:#fff;font-size:11px;text-align:center;padding:0 6px}
  aside .me{border-top:1px solid var(--line);padding:12px 10px 0;font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:8px}
  .top{display:none}
  main{min-width:0;padding:22px 26px 60px;max-width:1240px}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr}
    aside{position:fixed;inset:0 auto 0 0;width:min(280px,84vw);z-index:20;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
    body.menu aside{transform:none}
    body.menu .scrim{display:block}
    .top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,12,15,.92);backdrop-filter:blur(8px);z-index:10}
    .top button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center}
    main{padding:16px 14px 60px}
  }
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
  /* page */
  .ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .ph h1{font:700 26px 'Barlow Condensed';letter-spacing:.02em;text-transform:uppercase;margin:0;flex:1;min-width:0}
  .crumb{font-size:13px;color:var(--mute);margin-bottom:6px}
  .back{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--dim);text-decoration:none;font-weight:600;font-size:14px}
  .back:hover{color:var(--text);border-color:var(--line2)}
  .back svg{width:18px;height:18px}
  /* sport picker: tiles, ready for many sports */
  .sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;max-height:300px;overflow-y:auto;padding:2px}
  .sp-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px;padding:12px 8px;border:1.5px solid var(--line2);border-radius:12px;background:#202128;color:var(--dim);cursor:pointer;font-weight:600;font-size:14px}
  .sp-tile:hover{border-color:var(--mute);color:var(--text)}
  .sp-tile .sp-ic{width:44px;max-height:26px}
  .sp-tile[aria-checked="true"]{border-color:var(--acc);color:var(--text);background:rgba(255,90,31,.08)}
  .sp-tile[aria-checked="true"]::after{content:"✓";position:absolute;top:6px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;line-height:18px;text-align:center}
  .sp-find{margin-bottom:8px}
  .ag-sec{margin-bottom:18px}
  .ag-sec textarea{width:100%}
  .ag-list{display:grid;gap:6px}
  .ag-ch,.ag-p{border:1px solid var(--line2);border-radius:10px;background:#1b1c21;padding:0 12px}
  .ag-ch[open],.ag-p[open]{padding-bottom:12px}
  .ag-ch summary,.ag-p summary{display:flex;align-items:center;gap:10px;min-height:46px;cursor:pointer;list-style:none;flex-wrap:wrap;padding:6px 0}
  .ag-ch summary::-webkit-details-marker,.ag-p summary::-webkit-details-marker{display:none}
  .ag-ch summary img{height:18px;max-width:60px;object-fit:contain}
  .ag-ch summary .muted,.ag-p summary .muted{font-size:13px}
  .ag-p summary b{min-width:220px}
  .ag-p + .ag-p{margin-top:6px}
  .ag-p pre,.ag-ans{white-space:pre-wrap;word-break:break-word;background:#141519;border:1px solid var(--line2);border-radius:8px;padding:12px;font-size:12.5px;line-height:1.5;max-height:420px;overflow:auto;margin:4px 0 0}
  .ag-ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6;word-break:break-all}
  .tz-note{font-size:13px;color:var(--dim);margin:0 0 8px}
  .tz-note b{color:var(--text);font-weight:600}
  .rc-wl{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;font-size:14px}
  .rc-wl .muted{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .pre-l{background:#17181d;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:14px;word-break:break-all}
  .dp-q{width:100%;margin-bottom:8px}
  .dp-q input{width:100%}
  .dp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:max-content;gap:6px;max-height:212px;overflow-y:auto;overscroll-behavior:contain;padding:2px}
  .dp-row{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 10px;border:1.5px solid var(--line2);border-radius:10px;background:#202128;color:var(--dim);cursor:pointer;font:600 14px/1.2 inherit;text-align:left}
  .dp-row:hover{border-color:var(--mute);color:var(--text)}
  .dp-row .sp-ic{flex:none;width:34px;max-height:18px}
  .dp-row[aria-selected="true"]{border-color:var(--acc);color:var(--text);background:rgba(255,90,31,.08)}
  .dp-new{border-style:dashed}
  .dp-new b{flex:none;width:34px;text-align:center;font-size:18px;color:var(--acc)}
  .nd-box{width:min(620px,100%);text-align:left}
  .nd-grid{display:grid;grid-template-columns:220px 1fr;gap:16px;margin:14px 0 18px}
  .nd-pv{display:grid;place-items:center;gap:12px;min-height:200px;border:1px solid var(--line2);border-radius:12px;background:#17181d;padding:14px;text-align:center}
  .nd-big .sp-ic{width:170px;max-height:90px;color:var(--text)}
  .nd-sm{display:flex;gap:10px;align-items:center}
  .nd-sm .sp-tile{padding:10px 12px}
  @media (max-width:640px){ .nd-grid{grid-template-columns:1fr} }
  /* sport filter menu */
  .menu-wrap{position:relative}
  .menu-pop{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;max-height:320px;overflow-y:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:6px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .menu-pop button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--dim);font-weight:600;cursor:pointer;text-align:left}
  .menu-pop button:hover,.menu-pop button:focus-visible{background:var(--panel);color:var(--text)}
  .menu-pop button.on{color:var(--text)} .menu-pop button.on::after{content:"✓";margin-left:auto;color:var(--acc)}
  .menu-pop .sp-ic,.btn .sp-ic{width:28px;max-height:16px}
  /* AI setup window */
  .ai-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .ai-box{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:26px 24px 20px;width:min(440px,100%);text-align:center}
  .ai-box h2{font:700 24px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.02em;margin:14px 0 4px}
  .ai-box .spin{width:38px;height:38px;border-width:3px;margin:0 auto}
  .ai-box ul{list-style:none;padding:0;margin:18px 0;text-align:left;display:grid;gap:8px;font-size:14px;color:var(--dim)}
  .ai-box li::before{content:"✦";color:var(--acc);margin-right:10px}
  .ai-box .t{font-variant-numeric:tabular-nums}
  .crumb a{color:var(--dim);text-decoration:none} .crumb a:hover{color:var(--text)}
  h3{font:700 14px Barlow;letter-spacing:.1em;text-transform:uppercase;margin:24px 0 10px;color:var(--mute)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .grow{flex:1}
  .btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
  .btn:hover{border-color:var(--line2)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
  .btn.pri:hover{background:#ff6f3a;border-color:#ff6f3a}
  .btn.good{background:var(--good);color:#0b0c0f;border-color:var(--good)}
  .btn.bad{color:var(--bad)}
  .btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
  .btn.icon{width:32px;padding:0;justify-content:center}
  input,select,textarea{background:#202128;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;min-height:42px;width:100%;font-size:15px}
  input::placeholder,textarea::placeholder{color:#5d6069}
  textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  label.f{display:block;font-size:13px;font-weight:600;color:var(--dim);margin:0 0 6px}
  .help{font-size:12px;color:var(--mute);margin-top:4px}
  .search{position:relative;max-width:320px;flex:1;min-width:180px}
  .search input{padding-left:34px}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mute)}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
  .seg button{height:30px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--dim);font-weight:600;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--text);color:#0b0c0f}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:8px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi b{display:block;font:700 28px 'Barlow Condensed'} .kpi span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font:600 11px Barlow;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:var(--panel2);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  tr.click{cursor:pointer} tr.click:hover td{background:#1a1b21}
  tr.sel td{background:#1d1e25}
  td.num{color:var(--mute);width:40px}
  .nowrap{white-space:nowrap}
  .muted{color:var(--mute)} .dim{color:var(--dim)}
  .light{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .chip.good{color:var(--good);border-color:#2f5a35} .chip.warn{color:var(--warn);border-color:#5a4a1a} .chip.bad{color:var(--bad);border-color:#5a2420}
  .logo-sm{width:34px;height:22px;object-fit:contain;display:block}
  .logo-ph{width:34px;height:22px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 9px Barlow;color:var(--mute)}
  .empty{padding:28px;text-align:center;color:var(--mute)}
  .pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mute);font-size:13px}
  .head-card{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .head-card img{height:44px;max-width:110px;object-fit:contain}
  .head-card .links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
  .head-card .links a{color:var(--dim)}
  /* drawer */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:#111216;border-left:1px solid var(--line);z-index:30;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.45)}
  body.drawer-on .drawer{transform:none}
  body.drawer-on .scrim2{display:block}
  .scrim2{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  .dr-h{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line2);background:#16171c;box-shadow:inset 0 3px 0 var(--acc)}
  .dr-h b{flex:1;font:700 22px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.03em}
  body.drawer-on{overflow:hidden}
  .dr-b{grid-auto-rows:max-content;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 20px;display:grid;gap:14px;align-content:start}
  .dr-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line2);background:#16171c}
  .tt-peek{margin-top:6px} .tt-peek summary{cursor:pointer;list-style:none;display:inline-block} .tt-peek summary::-webkit-details-marker{display:none}
  .tt-box{margin-top:8px;padding:4px 12px;background:#0d0e11;border:1px solid #2d2f37;border-radius:10px;max-width:520px}
  .tt-box .rc-ses{font-size:13px;padding:6px 0;grid-template-columns:50px 1fr auto}
  .rc-meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--dim);font-size:14px}
  .rc-meta b{color:var(--text);font-weight:600}
  .rc-day{font:700 12px Barlow;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:6px 0 2px}
  .rc-ses{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid #2a2c33;font-size:15px}
  .rc-ses:last-child{border-bottom:0}
  .rc-ses time{font-variant-numeric:tabular-nums;font-weight:700}
  .rc-ses .t{font-size:12px;color:var(--mute)}
  .rc-ses.race b{color:var(--acc)}
  .rc-empty{border:1.5px dashed #3b3e47;border-radius:12px;padding:18px;text-align:center;color:var(--dim);display:grid;gap:12px;justify-items:center}
  .rc-link{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0d0e11;border:1px solid #3b3e47;border-radius:10px;overflow:hidden}
  .rc-link a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .se-day{background:#0d0e11;border:1px solid #2d2f37;border-radius:12px;padding:12px;display:grid;gap:8px}
  .se-day h5{margin:0;font:700 14px Barlow;color:var(--text);display:flex;align-items:center}
  .se-row{display:grid;grid-template-columns:110px 1fr 92px 34px;gap:8px;align-items:center}
  .se-row input{min-height:40px}
  .se-row .min{position:relative} .se-row .min input{padding-right:38px} .se-row .min span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mute);pointer-events:none}
  .se-head{display:grid;grid-template-columns:110px 1fr 92px 34px;gap:8px;font-size:12px;color:var(--mute);font-weight:600}
  @media (max-width:560px){.se-row,.se-head{grid-template-columns:96px 1fr 34px}.se-row .min,.se-head .h-min{display:none}}
  .fs{background:#1a1b21;border:1px solid #2d2f37;border-radius:14px;padding:16px;display:grid;gap:14px}
  .fs > h4{margin:0;display:flex;align-items:baseline;gap:10px;font:700 13px Barlow;letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
  .fs > h4 i{width:6px;height:6px;border-radius:50%;background:var(--acc);display:inline-block;transform:translateY(-2px)}
  .fs > h4 small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--mute);font-size:13px}
  .drawer input,.drawer select,.drawer textarea{background:#0d0e11;border-color:#3b3e47;color:var(--text)}
  .drawer input:hover,.drawer select:hover,.drawer textarea:hover{border-color:#50545e}
  .drawer label.f{color:#e9e9e6}
  .drawer .help{color:#8e919b}
  .drawer .sp-tile{background:#0d0e11;border-color:#3b3e47}
  .drawer .drop{background:#0d0e11;border-color:#3b3e47}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sess{display:grid;gap:6px}
  .srow{display:grid;grid-template-columns:128px 118px 1fr 116px 70px 32px;gap:6px;align-items:center}
  .srow.h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  .srow input,.srow select{min-height:34px;padding:6px 8px;font-size:14px}
  @media (max-width:560px){.two{grid-template-columns:1fr}.srow{grid-template-columns:1fr 1fr;padding:8px;border:1px solid var(--line);border-radius:10px}.srow.h{display:none}.srow .lab{grid-column:1/-1}}
  .login{max-width:380px;margin:12vh auto;text-align:center;padding:0 16px}
  .login .card{text-align:left;display:grid;gap:12px;margin-top:20px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#0b0c0f;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
  .toast.on{opacity:1}
  .ai-dock{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:45;max-width:min(380px,calc(100vw - 36px))}
  .ai-card{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;gap:10px;align-items:flex-start}
  .ai-card .grow{flex:1}
  .ai-card .x{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;line-height:1;padding:0 2px}
  .spin{width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp 0.9s linear infinite;flex:none;margin-top:2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
  .btn.ai::before{content:"✦";color:var(--acc);margin-right:6px}
  .evlist{display:grid;gap:4px;font-size:13px;margin:0;padding:0;list-style:none}
  .evlist li{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
  .evlist li:last-child{border-bottom:0}

// ---------- auth (Supabase magic link, no library) ----------
// One session for the whole site (admin, sign-up, the athlete's page), renewed by one page at a time.
// Two copies of the same session would make the server think a key was stolen and sign the person out.
const SKEY = "rnx_sess";
const S = {
  get(){ try {
    let s = JSON.parse(localStorage.getItem(SKEY) || "null");
    if (!s){ // older copies: keep the most recent one only
      s = ["rnx_user_sess", "rnx_admin_sess"].map(k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } }).filter(Boolean).sort((a, b) => b.expires_at - a.expires_at)[0] || null;
      if (s) localStorage.setItem(SKEY, JSON.stringify(s));
    }
    localStorage.removeItem("rnx_user_sess"); localStorage.removeItem("rnx_admin_sess");
    return s;
  } catch(e){ return null; } },
  set(v){ try { v ? localStorage.setItem(SKEY, JSON.stringify(v)) : localStorage.removeItem(SKEY); } catch(e){} }
};
function readHash(){
  if (!location.hash.includes("access_token")) return;
  const h = new URLSearchParams(location.hash.slice(1));
  S.set({ access_token:h.get("access_token"), refresh_token:h.get("refresh_token"), expires_at: Date.now()/1000 + (+h.get("expires_in") || 3600) });
  history.replaceState(null, "", location.pathname + location.search + "#/dashboard");
}
let refreshing = null;
async function token(){
  const s = S.get(); if (!s) return null;
  if (s.expires_at - 60 > Date.now()/1000) return s.access_token;
  if (!refreshing) refreshing = (async () => {
    const run = async () => {
      const cur = S.get(); if (!cur) return null;
      if (cur.expires_at - 60 > Date.now()/1000) return cur.access_token; // another tab already renewed it
      let r; try { r = await fetch(`${C.url}/auth/v1/token?grant_type=refresh_token`, { method:"POST", headers:{ apikey:C.key, "Content-Type":"application/json" }, body: JSON.stringify({ refresh_token: cur.refresh_token }) }); } catch(e){ return null; } // offline: stay signed in
      if (!r.ok){ const again = S.get(); if (again && again.refresh_token !== cur.refresh_token) return again.access_token; if (r.status === 400 || r.status === 401 || r.status === 403) S.set(null); return null; }
      const j = await r.json(); const n = { access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now()/1000 + j.expires_in }; S.set(n); return n.access_token;
    };
    try { return navigator.locks ? await navigator.locks.request("rnx-refresh", run) : await run(); } finally { setTimeout(() => { refreshing = null; }, 0); }
  })();
  return refreshing;
}
async function api(path, opt = {}){
  const t = await token();
  // never write anonymously: the database would ignore it and the page would wrongly say "saved"
  if (!t && opt.method && opt.method !== "GET") throw new Error("you've been signed out. Sign in again, then redo this change.");
  const r = await fetch(`${C.url}/rest/v1/${path}`, { ...opt, headers:{ apikey:C.key, Authorization:`Bearer ${t || C.key}`, "Content-Type":"application/json", Prefer:"return=representation", ...(opt.headers||{}) } });
  if (!r.ok){ let m = r.status + ""; try { const j = await r.json(); m = j.message || j.hint || m; } catch(e){} throw new Error(m); }
  if (opt.withCount){ const cr = r.headers.get("content-range") || ""; return { rows: await r.json(), total: +(cr.split("/")[1] || 0) }; }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
const rpc = (fn, args) => api(`rpc/${fn}`, { method:"POST", body: JSON.stringify(args || {}) });
const ins = (t, row) => api(t, { method:"POST", body: JSON.stringify(row) });
const upd = async (t, id, row) => { const r = await api(`${t}?id=eq.${id}`, { method:"PATCH", body: JSON.stringify(row) }); if (Array.isArray(r) && !r.length) throw new Error("nothing was changed (no permission, or it no longer exists). Reload the page and try again."); return r; };
const del = (t, id) => api(`${t}?id=eq.${id}`, { method:"DELETE" });
async function guard(fn, okMsg){ try { await fn(); if (okMsg) toast(okMsg); return true; } catch(e){ alert("Couldn't save: " + e.message); return false; } }

// ---------- AI agent: runs in the background, results land in the Review queue ----------
const RUNS = {};
function aiDock(){ let d = $("#ai-dock"); if (!d){ d = document.createElement("div"); d.id = "ai-dock"; d.className = "ai-dock"; d.setAttribute("aria-live", "polite"); document.body.appendChild(d); } return d; }
function showRuns(){
  const d = aiDock();
  d.querySelectorAll(".ai-run").forEach(n => n.remove());
  Object.values(RUNS).filter(r => !(r.hooks?.quiet && r.hooks.quiet())).forEach(r => d.insertAdjacentHTML("afterbegin", `<div class="ai-card ai-run"><span class="spin"></span><div class="grow"><b>${esc(r.label)}</b><div class="muted" style="font-size:13px">The AI is reading the official site. Usually 1–3 minutes. You can keep working.</div></div></div>`));
}
function aiNotice(msg, toReview, href = "#/review"){
  const d = aiDock(), n = document.createElement("div");
  n.className = "ai-card";
  n.innerHTML = `<div class="grow">${esc(msg)}${toReview ? `<div style="margin-top:8px"><a class="btn sm pri" href="${esc(href)}">Review</a></div>` : ""}</div><button class="x" aria-label="Dismiss">×</button>`;
  n.querySelector(".x").onclick = () => n.remove();
  n.querySelector("a")?.addEventListener("click", () => n.remove());
  d.appendChild(n);
}
const aiBusy = key => Object.values(RUNS).some(r => r.key === key);
// timetables: ask the AI for each upcoming race (next 60 days) that has no schedule yet
async function findTimetables(seriesId, quiet){
  const s = D.series.find(x => x.id === seriesId); if (!s) return 0;
  const lim = new Date(Date.now() + 60 * 864e5).toISOString().slice(0,10);
  const evs = await api(`events?series_id=eq.${seriesId}&end_date=gte.${TODAY}&start_date=lte.${lim}&select=id,name,start_date,sessions(id)&order=start_date&limit=6`).catch(() => []);
  const todo = evs.filter(e => !(e.sessions || []).length && !aiBusy(e.id)).slice(0, 3);
  for (const e of todo) runAgent({ action:"check_event", event_id:e.id }, `Timetable ${s.short_name || s.name} ${e.name}`, e.id);
  if (!todo.length && !quiet) toast("Every race in the next 60 days already has a schedule");
  return todo.length;
}
async function runAgent(body, label, key, hooks = {}){
  if (aiBusy(key)) return toast("Already checking…");
  const t = await token();
  let j = {}, ok = false;
  try { const r = await fetch(`${C.url}/functions/v1/agent`, { method:"POST", headers:{ apikey:C.key, Authorization:`Bearer ${t}`, "Content-Type":"application/json" }, body: JSON.stringify(body) }); ok = r.ok; j = await r.json().catch(() => ({})); } catch(e){ j = { error: e.message }; }
  if (!ok || !j.run_id) return alert("The AI couldn't start: " + (j.error || "no answer"));
  RUNS[j.run_id] = { label, key, t0: Date.now(), hooks, discover: body.action === "discover" };
  showRuns(); pollRun(j.run_id);
}
async function pollRun(id){
  await new Promise(r => setTimeout(r, 5000));
  const meta = RUNS[id]; let run = null;
  try { [run] = await api(`check_runs?id=eq.${id}&select=result,summary,error,usage`); } catch(e){}
  if ((!run || run.result === "running") && Date.now() - meta.t0 < 6 * 60e3) return pollRun(id);
  delete RUNS[id]; showRuns();
  if (meta.discover && run && run.result !== "error") await finalizeLogo(meta.key);
  if (meta.hooks.done && meta.hooks.done(run)) return;
  if (!run || run.result === "running") aiNotice(`${meta.label}: no answer after 6 minutes. Try again in a moment.`);
  else if (run.result === "error") aiNotice(`${meta.label} didn't work: ${run.error || "unknown error"}`);
  else { const sl = D.series.find(x => x.id === meta.key)?.slug; aiNotice(`${meta.label}: ${run.summary || "done."} (${usd(runCost(run.usage))})`, run.result === "proposal" || (meta.discover && /No logo/.test(run.summary || "")), meta.discover && sl ? `#/review/${sl}` : "#/review"); }
  if (!document.body.classList.contains("drawer-on")) route();
}

// ---------- circuits: found or created automatically, time zone from the location ----------
let tzLib = null;
function loadTz(){ if (tzLib) return tzLib; tzLib = new Promise(res => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/tz-lookup@6.1.25/tz.js"; s.onload = () => res(window.tzlookup || null); s.onerror = () => res(null); document.head.appendChild(s); }); return tzLib; }
const CC = { "united states":"US", usa:"US", "united kingdom":"GB", uk:"GB", france:"FR", spain:"ES", italy:"IT", portugal:"PT", belgium:"BE", germany:"DE", netherlands:"NL", austria:"AT", hungary:"HU", japan:"JP", china:"CN", australia:"AU", canada:"CA", mexico:"MX", brazil:"BR", argentina:"AR", bahrain:"BH", "saudi arabia":"SA", qatar:"QA", "united arab emirates":"AE", uae:"AE", singapore:"SG", malaysia:"MY", thailand:"TH", indonesia:"ID", india:"IN", "south africa":"ZA", monaco:"MC", switzerland:"CH", sweden:"SE", finland:"FI", poland:"PL", "czech republic":"CZ", czechia:"CZ", turkey:"TR", azerbaijan:"AZ", "south korea":"KR", korea:"KR", "new zealand":"NZ", morocco:"MA" };
async function ensureVenue(name, country){
  name = (name || "").trim(); if (!name) return null;
  const hit = D.venues.find(v => v.name.toLowerCase() === name.toLowerCase());
  if (hit) return hit.id;
  let lat = null, lng = null, tz = null, cc = CC[(country || "").toLowerCase()] || null, city = null;
  try {
    const q = encodeURIComponent([name, country].filter(Boolean).join(", "));
    const g = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&q=${q}`, { headers:{ "Accept-Language":"en" } }).then(r => r.json());
    if (g[0]){ lat = +g[0].lat; lng = +g[0].lon; const a = g[0].address || {}; city = a.town || a.city || a.village || a.county || a.state || null; if (!cc && a.country_code) cc = a.country_code.toUpperCase(); if (!country && a.country) country = a.country; }
    const lib = await loadTz(); if (lib && lat != null) tz = lib(lat, lng);
  } catch(e){}
  if (!tz){
    tz = prompt(`Time zone for "${name}"? (e.g. Europe/Paris, America/New_York)`, "Europe/Paris");
    if (!tz || !TZS.includes(tz)){ alert("Unknown time zone. The circuit wasn't created."); return null; }
  }
  const [v] = await ins("venues", { name, city, country: country || "", country_code: cc, lat, lng, timezone: tz });
  D.venues.push(v); toast(`Circuit added: ${name} (${tz})`);
  return v.id;
}

// ---------- drawer form ----------
let drawerResolve = null;
function closeDrawer(val){ document.body.classList.remove("drawer-on"); if (drawerResolve){ const r = drawerResolve; drawerResolve = null; r(val); } }
$("#dr-x").onclick = () => closeDrawer(null);
$("#scrim2").onclick = () => closeDrawer(null);
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("drawer-on")) closeDrawer(null); });
function fieldHtml(f, v){
  const id = "f_" + f.k; v = v ?? f.def ?? "";
  let input;
  if (f.type === "select") input = `<select id="${id}" ${f.req ? "required" : ""}>${f.empty !== false ? `<option value="">—</option>` : ""}${f.options.map(o => `<option value="${esc(o.v)}"${String(o.v) === String(v) ? " selected" : ""}>${esc(o.l)}</option>`).join("")}</select>`;
  else if (f.type === "textarea") input = `<textarea id="${id}" placeholder="${esc(f.ph || "")}">${esc(v)}</textarea>`;
  else if (f.type === "bool") input = `<label class="sw"><input type="checkbox" id="${id}"${v ? " checked" : ""}> ${esc(f.l2 || "")}</label>`;
  else input = `<input id="${id}" type="${f.type || "text"}" value="${esc(v)}" ${f.req ? "required" : ""} placeholder="${esc(f.ph || "")}"${f.list ? ` list="${f.list}"` : ""}${f.step ? ` step="${f.step}"` : ""}>`;
  return `<div${f.wide ? ' style="grid-column:1/-1"' : ""}><label class="f" for="${id}">${esc(f.l)}${f.req ? " *" : ""}</label>${input}${f.help ? `<div class="help">${esc(f.help)}</div>` : ""}</div>`;
}
function readField(f){
  const el = $("#f_" + f.k); if (!el) return undefined;
  let v = f.type === "bool" ? el.checked : el.value.trim();
  if (f.type === "number") v = v === "" ? null : +v; else if (v === "" && f.type !== "bool") v = null;
  return v;
}
// layout: array of fields or {row:[f,f]} pairs; extra: html appended; returns values or null
function drawer(title, layout, values = {}, opts = {}){
  return new Promise(resolve => {
    drawerResolve = resolve;
    const all = [];
    $("#dr-t").textContent = title;
    const one = item => {
      if (item.html) return item.html;
      if (item.section) return `<section class="fs"><h4><i></i>${esc(item.section)}${item.sub ? ` <small>${esc(item.sub)}</small>` : ""}</h4>${item.items.map(one).join("")}</section>`;
      if (item.row){ item.row.forEach(f => all.push(f)); return `<div class="two">${item.row.map(f => fieldHtml(f, values[f.k])).join("")}</div>`; }
      all.push(item); return fieldHtml(item, values[item.k]);
    };
    $("#dr-b").innerHTML = layout.map(one).join("") + (opts.extra || "");
    $("#dr-f").innerHTML = `${opts.onDelete ? `<button class="btn bad" id="dr-del" style="margin-right:auto">${esc(opts.deleteLabel || "Delete")}</button>` : ""}<button class="btn" id="dr-cancel">${opts.view ? "Close" : "Cancel"}</button>${opts.view ? "" : `<button class="btn pri" id="dr-ok">${esc(opts.ok || "Save")}</button>`}`;
    $("#dr-cancel").onclick = () => closeDrawer(null);
    if ($("#dr-ok")) $("#dr-ok").onclick = () => {
      for (const f of all){ const el = $("#f_" + f.k); if (f.req && el && !el.value.trim()){ el.focus(); el.reportValidity && el.setCustomValidity("Required"); el.reportValidity(); el.setCustomValidity(""); return; } }
      const out = {}; all.forEach(f => out[f.k] = readField(f));
      if (opts.collect) Object.assign(out, opts.collect());
      closeDrawer(out);
    };
    if (opts.onDelete) $("#dr-del").onclick = () => { if (confirm(opts.deleteText || "Delete this item? This can't be undone.")) closeDrawer({ __delete:true }); };
    document.body.classList.add("drawer-on");
    $("#dr-b").scrollTop = 0;
    if (opts.after) opts.after();
    setTimeout(() => { const first = $("#dr-b input, #dr-b select, #dr-b textarea"); if (first && matchMedia("(min-width:861px)").matches) first.focus(); }, 230);
  });
}

async function loadList(){
  const f = [];
  if (CQ.q){ const q = CQ.q.replace(/[(),*]/g, ""); f.push(`or=(name.ilike.*${q}*,short_name.ilike.*${q}*,slug.ilike.*${q}*)`); }
  if (CQ.sport) f.push(`sport=eq.${encodeURIComponent(CQ.sport)}`);
  if (CQ.attn) f.push(`or=(missing_soon.gt.0,pending_proposals.gt.0,last_check_result.eq.error)`);
  const from = CQ.page * PAGE;
  const { rows, total } = await api(`series_overview?select=*&order=name&${f.join("&")}`, { headers:{ Prefer:"count=exact", Range:`${from}-${from + PAGE - 1}` }, withCount:true });
  const status = s => s.last_check_result === "error" ? ["bad","Agent error"] : s.pending_proposals > 0 ? ["warn", `${s.pending_proposals} to review`] : s.missing_soon > 0 ? ["warn","Schedule missing"] : s.last_check_at ? ["good","Up to date"] : ["","Not checked yet"];
  const col = { good:"var(--good)", warn:"var(--warn)", bad:"var(--bad)", "":"var(--mute)" };
  $("#c-list").innerHTML = rows.length ? `<div class="tbl"><table><tr><th style="width:52px"></th><th>Championship</th><th style="width:80px">Discipline</th><th class="nowrap">Races ${YEAR}</th><th class="nowrap">Races ${YEAR+1}</th><th>Status</th></tr>
    ${rows.map(s => { const st = status(s); return `<tr class="click" data-slug="${esc(s.slug)}"><td>${s.logo_url ? `<img class="logo-sm" src="${esc(s.logo_url)}" alt="">` : `<div class="logo-ph">${esc(s.short_name.slice(0,4))}</div>`}</td><td><b>${esc(s.name)}</b>${s.short_name && s.short_name !== s.name ? ` <span class="dim">(${esc(s.short_name)})</span>` : ""}</td><td>${sportIcon(s.sport)}</td><td>${s.races_this_year}</td><td>${s.races_next_year}</td><td class="nowrap"><span class="light" style="background:${col[st[0]]}"></span>${st[1]}</td></tr>`; }).join("")}</table></div>
    <div class="pager">${from + 1}–${Math.min(from + PAGE, total)} of ${total} <button class="btn sm" id="pg-prev"${CQ.page ? "" : " disabled"}>‹</button><button class="btn sm" id="pg-next"${from + PAGE < total ? "" : " disabled"}>›</button></div>`
    : `<div class="card empty">No championship found.</div>`;
  $$("[data-slug]").forEach(r => r.onclick = () => location.hash = `#/championships/${r.dataset.slug}`);
  const pp = $("#pg-prev"), pn = $("#pg-next");
  if (pp) pp.onclick = () => { CQ.page--; loadList(); };
  if (pn) pn.onclick = () => { CQ.page++; loadList(); };
}

  if (s.logo_url && s.logo_url.includes("-agent-") && !aiBusy(s.id)) finalizeLogo(s.id).then(ok => { if (ok){ const im = $(".head-card img"); const n = D.series.find(x => x.id === s.id); if (im && n) im.src = n.logo_url; } });
  const [src] = await api(`series_sources?series_id=eq.${s.id}&select=*`);
  const evs = await api(`event_overview?series_id=eq.${s.id}&select=*&order=start_date`);
  const upcoming = evs.filter(e => e.end_date >= TODAY), past = evs.filter(e => e.end_date < TODAY).reverse();
  const watchChip = (w, e) => w === "race" ? '<span class="chip good">Event broadcast</span>' : w === "championship" ? '<span class="chip">Championship</span>' : e.end_date < TODAY ? '<span class="chip">–</span>' : e.start_date <= new Date(Date.now() + 7*864e5).toISOString().slice(0,10) ? '<span class="chip warn">Missing</span>' : '<span class="chip">Race week</span>';

  const table = list => `<div class="tbl"><table><tr><th>Race</th><th class="hide-m">Circuit</th><th>Dates</th><th>Schedule</th><th class="hide-m">Where to watch</th><th class="hide-m">Last check</th></tr>
      ${list.map(e => `<tr class="click${e.id === openId ? " sel" : ""}" data-id="${e.id}"><td><b>${esc(e.name)}</b>${e.duration_label ? ` <span class="muted">${esc(e.duration_label)}</span>` : ""}${e.pending_proposals ? ` <span class="chip warn">review</span>` : ""}</td><td class="hide-m dim">${esc(e.venue_name || "")}</td><td class="nowrap">${fmtRange(e.start_date, e.end_date)} <span class="muted">${e.start_date.slice(0,4)}</span></td><td>${schedChip(e)}</td><td class="hide-m">${watchChip(e.watch_status, e)}</td><td class="hide-m muted nowrap">${e.last_check_result === "error" ? '<span class="chip bad">error</span>' : ago(e.last_check_at)}</td></tr>`).join("")}</table></div>`;

      <button class="btn ai" id="s-ai"${aiBusy(s.id) ? " disabled" : ""} title="Finds the official site, logo, calendar and where to watch">${aiBusy(s.id) ? "Checking…" : "Check calendar with AI"}</button><button class="btn ai" id="s-tt" title="Searches the official timetable of each race in the next 60 days that has no schedule yet">Find timetables</button><button class="btn" id="s-edit">Edit championship</button></div>

  const yr = upcoming[0] ? +upcoming[0].start_date.slice(0,4) : YEAR;
  $("#e-add").onclick = () => editRace(s, null, yr);

    up.hidden = true; if (pa) pa.hidden = true; res.hidden = false;
    res.innerHTML = hits.length ? table(hits) : `<div class="card empty">No race matches “${esc(q)}”.</div>`;
    bind();
  };
  if (openId){ const e = evs.find(x => x.id === openId); if (e) editRace(s, e, yr); }
}

// ---------- Race card: a clean view of one race (schedule, where to watch), editing on demand ----------
const days = (a, b) => { const out = []; if (!a || !b) return out; for (let t = new Date(a + "T12:00:00Z"); t <= new Date(b + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + 1)) out.push(t.toISOString().slice(0,10)); return out; };
const dayName = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long", timeZone:"UTC" });

// Import a whole season: one race per line
async function importCalendar(s, yr, existing){
  const r = await drawer(`Import ${s.short_name} ${yr} calendar`, [
    { html:`<p class="dim" style="margin:0">One race per line: <b>dates · race name · circuit, country · length</b>. Copy it from the official calendar; circuits are found or created automatically.</p>` },
    { k:"txt", l:"Calendar", type:"textarea", ph:`12-14 Mar | 4 Hours of Barcelona | Circuit de Barcelona-Catalunya, Spain | 4h\n2-4 Jul | 4 Hours of Imola | Autodromo Enzo e Dino Ferrari, Italy | 4h\n2027-10-14 2027-10-16 | 4 Hours of Portimão | Algarve International Circuit, Portugal | 4h` }
  ], {}, { ok:"Import races" });
  if (!r || !r.txt) return;
  const MON = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12 };
  const pad = n => String(n).padStart(2, "0");
  const parseDates = t => {
    t = t.trim(); let m;
    if ((m = t.match(/(\d{4}-\d{2}-\d{2})\D+(\d{4}-\d{2}-\d{2})/))) return [m[1], m[2]];
    if ((m = t.match(/^(\d{4}-\d{2}-\d{2})$/))) return [m[1], m[1]];
    if ((m = t.match(/^(\d{1,2})\s*[-–]\s*(\d{1,2})\s+([a-z]{3})/i))) { const mo = MON[m[3].toLowerCase()]; return [`${yr}-${pad(mo)}-${pad(m[1])}`, `${yr}-${pad(mo)}-${pad(m[2])}`]; }
    if ((m = t.match(/^(\d{1,2})\s+([a-z]{3})\w*\s*[-–]\s*(\d{1,2})\s+([a-z]{3})/i))) return [`${yr}-${pad(MON[m[2].toLowerCase()])}-${pad(m[1])}`, `${yr}-${pad(MON[m[4].toLowerCase()])}-${pad(m[3])}`];
    if ((m = t.match(/^(\d{1,2})\s+([a-z]{3})/i))) { const d = `${yr}-${pad(MON[m[2].toLowerCase()])}-${pad(m[1])}`; return [d, d]; }
    return null;
  };
  const rows = [];
  for (const line of r.txt.split("\n").map(x => x.trim()).filter(Boolean)){
    const parts = line.split(/\s*[|\t]\s*/);
    const d = parseDates(parts[0] || "");
    if (!d || !parts[1]){ alert("Couldn't read: " + line + "\n\nUse: dates | race name | circuit, country | length"); return; }
    const circ = (parts[2] || "").split(",").map(x => x.trim());
    const country = circ.length > 1 ? circ.pop() : "";
    rows.push({ start_date:d[0], end_date:d[1], name:parts[1].trim(), venue:circ.join(", "), country, dur:(parts[3] || "").trim() || null });
  }
  rows.sort((a, b) => a.start_date.localeCompare(b.start_date));
  await guard(async () => {
    let n = existing;
    for (const x of rows){
      n++;
      const venue_id = x.venue ? await ensureVenue(x.venue, x.country) : null;
      const row = { series_id:s.id, year:+x.start_date.slice(0,4), round:n, name:x.name, start_date:x.start_date, end_date:x.end_date, duration_label:x.dur, venue_id };
      row.ext_key = extKey(s, row);
      await ins("events", row);
    }
    route();
  }, `${rows.length} races imported`);
}

// Logos: every championship logo ends up the same way: the logo alone (AI finds it), background cut out,
// pure white, trimmed tight and saved at one standard size (transparent PNG)
const LOGO_H = 240, LOGO_W = 800;
function loadImg(src){ return new Promise((res, rej) => { const im = new Image(); im.crossOrigin = "anonymous"; im.onload = () => res(im); im.onerror = () => rej(new Error("image")); im.src = src; }); }
async function imgOf(file){ return loadImg(typeof file === "string" ? file : URL.createObjectURL(file)); }
// a small JPEG on grey (so white and dark logos both show) for the AI to look at
function aiThumb(img, max = 640){
  const iw = img.naturalWidth || img.width || 600, ih = img.naturalHeight || img.height || 300;
  const sc = Math.min(max / Math.max(iw, ih), /svg/i.test(img.src) ? 4 : 1);
  const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(iw * sc)); cv.height = Math.max(1, Math.round(ih * sc));
  const cx = cv.getContext("2d"); cx.fillStyle = "#8a8f98"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", 0.85).split(",")[1];
}
async function logoAI(body){

async function processLogo(file, opt = {}){
  const img = await imgOf(file);
  const iw = img.naturalWidth || img.width || 900, ih = img.naturalHeight || img.height || 300;
  const scale = /svg/i.test(img.src) || (file && /svg/.test(file.type || "")) ? 1400 / Math.max(iw, ih) : Math.min(1, 1600 / Math.max(iw, ih));
  let w = Math.max(1, Math.round(iw * scale)), h = Math.max(1, Math.round(ih * scale));
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  let cx = cv.getContext("2d", { willReadFrequently:true }); cx.drawImage(img, 0, 0, w, h);
  // keep only the logo the AI pointed at (with a little margin)
  const b = opt.box;
  if (b && (b[2] - b[0] < 0.97 || b[3] - b[1] < 0.97)){
    const m = 0.015, x0 = Math.max(0, Math.floor((b[0] - m) * w)), y0 = Math.max(0, Math.floor((b[1] - m) * h)), x1 = Math.min(w, Math.ceil((b[2] + m) * w)), y1 = Math.min(h, Math.ceil((b[3] + m) * h));
    const c2 = document.createElement("canvas"); c2.width = x1 - x0; c2.height = y1 - y0;
    c2.getContext("2d").drawImage(cv, x0, y0, x1 - x0, y1 - y0, 0, 0, x1 - x0, y1 - y0);
    cv.width = w = c2.width; cv.height = h = c2.height; cx = cv.getContext("2d", { willReadFrequently:true }); cx.drawImage(c2, 0, 0);
  }
  const d = cx.getImageData(0, 0, w, h), px = d.data;
  // background = most common colour around the border (or transparent)
  const border = []; const at = (x, y) => { const k = (y * w + x) * 4; border.push([px[k], px[k+1], px[k+2], px[k+3]]); };
  for (let x = 0; x < w; x += Math.max(1, w >> 7)){ at(x, 0); at(x, h - 1); }
  for (let y = 0; y < h; y += Math.max(1, h >> 7)){ at(0, y); at(w - 1, y); }
  const transparentBg = border.filter(q => q[3] < 40).length > border.length * 0.5;
  const solid = border.filter(q => q[3] >= 40);
  const med = i => solid.map(q => q[i]).sort((a, c) => a - c)[solid.length >> 1] || 0;
  const bg = [med(0), med(1), med(2)];
  const A = new Float32Array(w * h);
  for (let i = 0, k = 0; i < A.length; i++, k += 4){
    A[i] = transparentBg ? px[k+3] : Math.max(0, Math.min(255, (Math.hypot(px[k] - bg[0], px[k+1] - bg[1], px[k+2] - bg[2]) - 22) * 3.2)) * (px[k+3] / 255);
  }
  // badge logos (name cut out of a filled shape): the shape becomes white and the name is cut out, like official white versions
  if (opt.badge){
    const hist = new Map();
    for (let i = 0, k = 0; i < A.length; i++, k += 4) if (A[i] > 230){ const q = (px[k] >> 4) << 8 | (px[k+1] >> 4) << 4 | (px[k+2] >> 4); hist.set(q, (hist.get(q) || 0) + 1); }
    const tot = [...hist.values()].reduce((a, c) => a + c, 0), top = [...hist.entries()].sort((a, c) => c[1] - a[1]);
    const col = q => [((q >> 8) & 15) * 16 + 8, ((q >> 4) & 15) * 16 + 8, (q & 15) * 16 + 8];
    if (top.length > 1 && top[0][1] > tot * 0.35){
      const P = col(top[0][0]);
      const sec = top.slice(1).find(e => { const c = col(e[0]); return Math.hypot(c[0] - P[0], c[1] - P[1], c[2] - P[2]) > 90; });
      if (sec && sec[1] > tot * 0.02){
        const S = col(sec[0]);
        for (let i = 0, k = 0; i < A.length; i++, k += 4){
          const dp = Math.hypot(px[k] - P[0], px[k+1] - P[1], px[k+2] - P[2]), ds = Math.hypot(px[k] - S[0], px[k+1] - S[1], px[k+2] - S[2]);
          A[i] *= Math.max(0, Math.min(1, (ds / (dp + ds + 1e-6) - 0.3) * 2.5));
        }
      }
    }
  }
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let i = 0, k = 0; i < A.length; i++, k += 4){
    px[k] = px[k+1] = px[k+2] = 255; px[k+3] = A[i];
    if (A[i] > 28){ const x = i % w, y = (i / w) | 0; if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  cx.putImageData(d, 0, 0);
  if (maxX < minX) throw new Error("No logo found in this image");
  // standard size: trimmed tight, fitted in LOGO_W × LOGO_H, small even margin
  const cw = maxX - minX + 1, ch = maxY - minY + 1;
  const k = Math.min(LOGO_W / cw, LOGO_H / ch), pad = Math.round(LOGO_H * 0.03);
  const ow = Math.round(cw * k) + pad * 2, oh = Math.round(ch * k) + pad * 2;
  const out = document.createElement("canvas"); out.width = ow; out.height = oh;
  const ox = out.getContext("2d"); ox.imageSmoothingQuality = "high";
  ox.drawImage(cv, minX, minY, cw, ch, pad, pad, ow - pad * 2, oh - pad * 2);
  return await new Promise(res => out.toBlob(res, "image/png"));
}

function aiSetup(n){

  const m = document.createElement("div");
  m.className = "ai-modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true"); m.setAttribute("aria-labelledby", "ai-h");

    <div class="bar" style="justify-content:center;margin:0"><button class="btn" id="ai-bg">Keep working, notify me</button></div></div>`;
  document.body.appendChild(m);
  const t0 = Date.now(), tick = setInterval(() => { const el = $("#ai-t"); if (el) el.textContent = Math.round((Date.now() - t0) / 1000) + "s"; }, 1000);
  let open = true;

  $("#ai-bg").onclick = () => { close(); location.hash = `#/championships/${n.slug}`; };
  $("#ai-bg").focus();
  runAgent({ action:"discover", series_id:n.id }, `Setting up ${label}`, n.id, {
    quiet: () => open,
    done(run){
      if (!open) return false;
      clearInterval(tick);
      if (run && run.result === "proposal"){ close(); location.hash = `#/review/${n.slug}`; return true; }
      const box = m.querySelector(".ai-box");
      box.innerHTML = run && run.result === "no_change"
        ? `<h2>${esc(label)} is ready</h2><p class="dim">${esc(run.summary || "")}</p><div class="bar" style="justify-content:center;margin:0"><button class="btn pri" id="ai-ok">Open championship</button></div>`
        : `<h2>That didn't work</h2><p class="dim">${esc(run?.error || "No answer from the AI yet.")}</p><div class="bar" style="justify-content:center;margin:0"><button class="btn" id="ai-ok">Open championship</button><button class="btn pri" id="ai-retry">Try again</button></div>`;
      $("#ai-ok").onclick = () => { close(); location.hash = `#/championships/${n.slug}`; };
      if ($("#ai-retry")) $("#ai-retry").onclick = () => { close(); aiSetup(n); };
      $("#ai-ok").focus();
      return true;
    }
  });
}

async function finalizeLogo(sid){
  const [x] = await api(`series?id=eq.${sid}&select=id,slug,name,short_name,logo_url,logo_candidates`);
  if (!x) return false;
  const cands = (x.logo_candidates || []).length ? x.logo_candidates : (x.logo_url?.includes("-agent-") ? [x.logo_url] : []);
  if (!cands.length || (x.logo_url && !x.logo_url.includes("-agent-"))) return false;
  try {
    const imgs = (await Promise.all(cands.map(u => loadImg(u).catch(() => null))));
    const ok = imgs.map((im, i) => im ? i : -1).filter(i => i >= 0);
    if (!ok.length) throw new Error("no image");
    const r = await logoAI({ images: ok.map(i => aiThumb(imgs[i])), name: x.name, short: x.short_name });
    if (!(r.index >= 0)){ await upd("series", x.id, { logo_url: null, logo_candidates: null }); await loadRef(); return true; }
    const white = await processLogo(cands[ok[r.index]], { box: r.box, badge: r.badge });
    const url = await uploadMedia(white, `series/${x.slug}-${Date.now()}.png`);
    await upd("series", x.id, { logo_url: url, logo_candidates: null });
    await loadRef();
    return true;
  } catch(e){ return false; }
}

    ${runs.length ? `<div class="tbl"><table><tr><th>When</th><th>Championship</th><th class="hide-m">Check</th><th>Result</th><th class="hide-m">Time</th><th style="text-align:right">Cost</th></tr>
      ${runs.map(r => { const st = RES[r.result] || ["", r.result]; const secs = r.finished_at ? Math.round((new Date(r.finished_at) - new Date(r.ran_at)) / 1000) : null; return `<tr title="${esc(r.summary || r.error || "")}"><td class="nowrap muted">${new Date(r.ran_at).toLocaleString("en-GB", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" })}</td><td><b>${esc(r.series?.short_name || "")}</b>${r.events ? ` <span class="dim">${esc(r.events.name)}</span>` : ""}</td><td class="hide-m">${KIND[r.kind] || r.kind}${r.usage?.model ? `<div class="muted" style="font-size:12px">${esc(r.usage.model.replace(/claude-/g, "").replace(/-5-5/g, ""))}</div>` : ""}</td><td class="nowrap"><span class="chip ${st[0]}">${st[1]}</span></td><td class="hide-m muted">${secs != null ? secs + "s" : "–"}</td><td style="text-align:right" class="nowrap">${r.usage ? usd(runCost(r.usage)) : "–"}</td></tr>`; }).join("")}</table></div>`
    : `<div class="card empty">No AI checks yet.</div>`}`;
  $("#ac-save").onclick = () => guard(async () => {
    const value = { ...cfg, enabled: $("#ac-on").checked, daily_ai_limit: Math.max(1, +$("#ac-cap").value || 40) };
    await api("app_settings", { method:"POST", headers:{ Prefer:"resolution=merge-duplicates,return=minimal" }, body: JSON.stringify({ key:"auto_checks", value, updated_at: new Date().toISOString() }) });
    usage();
  }, "Saved");
}

// ---------- Users ----------
const SOC = ["instagram","facebook","x","youtube","tiktok","website"];
async function users(){
  const [pages, accts] = await Promise.all([rpc("admin_users"), rpc("admin_accounts")]);
  const loose = accts.filter(a => !a.pages && !a.is_admin);
  $("#main").innerHTML = `<div class="ph"><h1>Users</h1><label class="search">${I.search}<input id="u-q" placeholder="Search users" aria-label="Search users"></label><button class="btn pri" id="u-add">+ Add page</button></div>
    ${pages.length ? `<div class="tbl"><table><tr><th>Page</th><th class="hide-m">Account</th><th>Status</th><th class="hide-m">Subscription</th></tr>
      ${pages.map(p => `<tr class="click" data-pid="${p.profile_id}"><td><b>${esc(p.display_name)}</b> <span class="muted">/${esc(p.slug)}</span></td><td class="hide-m dim">${p.members.length ? p.members.map(m => `${esc(m.email)}${m.role !== "owner" ? ` <span class="muted">(${m.role})</span>` : ""}`).join(", ") : '<span class="muted">Managed by admin</span>'}</td><td>${p.published ? '<span class="chip good">Live</span>' : '<span class="chip">Hidden</span>'}</td><td class="hide-m">${p.subscription_status === "active" ? '<span class="chip good">Active</span>' : `<span class="chip">${esc(p.subscription_status || "–")}</span>`}</td></tr>`).join("")}</table></div>` : `<div class="card empty">No user pages yet.</div>`}
    ${loose.length ? `<h3>Accounts without a page</h3><div class="tbl"><table><tr><th>Email</th><th>Joined</th></tr>${loose.map(a => `<tr><td>${esc(a.email)}</td><td class="muted">${ago(a.created_at)}</td></tr>`).join("")}</table></div>` : ""}`;
  $("#u-add").onclick = () => editProfile();
  $$("[data-pid]").forEach(r => r.onclick = () => openProfile(r.dataset.pid));
  $("#u-q").oninput = e => { const q = e.target.value.toLowerCase(); $$("tr[data-pid]").forEach(tr => tr.hidden = !tr.textContent.toLowerCase().includes(q)); };
}
async function editProfile(p){
  const r = await drawer(p ? `Edit ${p.display_name}` : "Add page", [
    { row:[{ k:"display_name", l:"Full name", req:true }, { k:"first_name", l:"First name", help:"Shown as “<Name> Race Hub”" }] },
    { row:[{ k:"slug", l:"Page address", req:true, ph:"louis", help:"racenxt.com/…" }, { k:"sport", l:"Sport", def:"motorsport" }] },
    { k:"hero_url", l:"Main photo (image link)", type:"url" },
    { row:[{ k:"photo_url", l:"Profile photo (image link)", type:"url" }, { k:"logo_url", l:"Personal logo (image link)", type:"url" }] },
    { html:`<h3 style="margin:8px 0 0">Social links</h3>` },
    { row:[{ k:"s_instagram", l:"Instagram", type:"url" }, { k:"s_facebook", l:"Facebook", type:"url" }] },
    { row:[{ k:"s_x", l:"X", type:"url" }, { k:"s_youtube", l:"YouTube", type:"url" }] },
    { row:[{ k:"s_tiktok", l:"TikTok", type:"url" }, { k:"s_website", l:"Website", type:"url" }] },
    { k:"published", l:"Page", type:"bool", l2:"Visible to fans (switch off to take the page down)" }
  ], { ...(p || {}), ...Object.fromEntries(SOC.map(s => ["s_" + s, p?.socials?.[s] || ""])) }, { onDelete: !!p, deleteText:"Delete this page and everything on it?" });
  if (!r) return;
  if (r.__delete) return guard(async () => { await del("profiles", p.id); location.hash = "#/users"; route(); }, "Page deleted");
  const socials = {}; SOC.forEach(s => { if (r["s_" + s]) socials[s] = r["s_" + s]; delete r["s_" + s]; });
  const row = { ...r, socials, slug: slugify(r.slug), updated_at: new Date().toISOString() };
  await guard(async () => {
    if (p){ await upd("profiles", p.id, row); openProfile(p.id); }
    else { const [n] = await ins("profiles", row); await ins("subscriptions", { profile_id:n.id, status:"active", provider:"manual" }); openProfile(n.id); }
  }, "Saved");
}
async function openProfile(id){
  const [[p], ens, sps] = await Promise.all([api(`profiles?id=eq.${id}&select=*`), api(`entries?profile_id=eq.${id}&select=*,series(short_name,name),vehicles(name)&order=year.desc`), api(`sponsors?profile_id=eq.${id}&select=*&order=sort`)]);
  const page = new URL(`./${p.slug}`, location.href.split("#")[0]).href;
  $("#main").innerHTML = `<a class="back" href="#/users">${I.back}All users</a>
    <div class="ph"><h1>${esc(p.display_name)}</h1>${p.published ? '<span class="chip good">Live</span>' : '<span class="chip">Hidden</span>'}<a class="btn" href="${esc(page)}" target="_blank" rel="noopener">Open page ↗</a><button class="btn" id="p-edit">Edit</button></div>
    <h3>Championships</h3>
    ${ens.length ? `<div class="tbl"><table><tr><th>Championship</th><th>Team</th><th class="hide-m">Vehicle</th><th>#</th><th class="hide-m">Colour</th></tr>${ens.map((e, i) => `<tr class="click" data-e="${i}"><td><b>${esc(e.series?.short_name)}</b> ${e.year}</td><td>${esc(e.team || "")}</td><td class="hide-m dim">${esc(e.vehicles?.name || "")}</td><td>${esc(e.car_number || "")}</td><td class="hide-m">${e.color ? `<span class="light" style="background:${esc(e.color)}"></span>` : ""}</td></tr>`).join("")}</table></div>` : `<div class="card empty">No championships yet.</div>`}
    <div class="bar" style="margin-top:8px"><button class="btn pri" id="en-add">+ Add championship</button></div>
    <h3>Sponsors</h3>
    ${sps.length ? `<div class="tbl"><table><tr><th>Sponsor</th><th class="hide-m">Link</th><th>Logo</th></tr>${sps.map((s, i) => `<tr class="click" data-sp="${i}"><td><b>${esc(s.name)}</b></td><td class="hide-m dim">${esc(s.link_url || "")}</td><td>${s.logo_original_url ? `<img src="${esc(s.logo_original_url)}" alt="" style="height:22px;max-width:90px;object-fit:contain;${s.display === "white" ? "filter:brightness(0) invert(1)" : ""}">` : ""}</td></tr>`).join("")}</table></div>` : `<div class="card empty">No sponsors yet.</div>`}
    <div class="bar" style="margin-top:8px"><button class="btn pri" id="sp-add">+ Add sponsor</button></div>`;
  $("#p-edit").onclick = () => editProfile(p);
  $("#en-add").onclick = () => editEntry(p);
  $("#sp-add").onclick = () => editSponsor(p, null, sps.length);
  $$("[data-e]").forEach(r => r.onclick = () => editEntry(p, ens[+r.dataset.e]));
  $$("[data-sp]").forEach(r => r.onclick = () => editSponsor(p, sps[+r.dataset.sp]));
}
async function editEntry(p, en){
  const r = await drawer(en ? "Edit championship" : "Add championship", [
    { k:"series_id", l:"Championship", type:"select", options: seriesOpts(), req:true },
    { row:[{ k:"year", l:"Season", type:"number", req:true, def: YEAR + 1 }, { k:"car_number", l:"Car number" }] },
    { row:[{ k:"team", l:"Team" }, { k:"category", l:"Category", ph:"LMP2" }] },
    { k:"vehicle_id", l:"Vehicle", type:"select", options: vehicleOpts() },
    { k:"teammates", l:"Teammates (comma separated)" },
    { k:"color", l:"Colour for this championship", type:"color", def:"#8a8d96" }
  ], en ? { ...en, teammates:(en.teammates || []).join(", ") } : {}, { onDelete: !!en, deleteLabel:"Remove" });
  if (!r) return;
  if (r.__delete) return guard(async () => { await del("entries", en.id); openProfile(p.id); }, "Removed");
  const row = { ...r, profile_id:p.id, teammates:(r.teammates || "").split(",").map(x => x.trim()).filter(Boolean) };
  await guard(async () => { en ? await upd("entries", en.id, row) : await ins("entries", row); openProfile(p.id); }, "Saved – every race of that season is on the page");
}
async function editSponsor(p, s, n = 0){
  const r = await drawer(s ? `Edit ${s.name}` : "Add sponsor", [
    { k:"name", l:"Name", req:true }, { k:"logo_original_url", l:"Logo (image link)", type:"url" }, { k:"link_url", l:"Link", type:"url" },
    { row:[{ k:"display", l:"Show logo", type:"select", empty:false, options:[{ v:"white", l:"In white" }, { v:"original", l:"Original colours" }] }, { k:"sort", l:"Order", type:"number", def:n }] }
  ], s || {}, { onDelete: !!s, deleteLabel:"Remove" });
  if (!r) return;
  if (r.__delete) return guard(async () => { await del("sponsors", s.id); openProfile(p.id); }, "Removed");
  await guard(async () => { s ? await upd("sponsors", s.id, r) : await ins("sponsors", { ...r, profile_id:p.id }); openProfile(p.id); }, "Sponsor saved");
}

// ---------- Library ----------
function listPage(title, rows, cols, onAdd, onOpen, addLabel, note){
  $("#main").innerHTML = `<div class="ph"><h1>${title}</h1><label class="search">${I.search}<input id="l-q" placeholder="Search" aria-label="Search"></label>${onAdd ? `<button class="btn pri" id="l-add">${addLabel}</button>` : ""}</div>${note ? `<p class="dim" style="margin-top:-6px">${note}</p>` : ""}
    ${rows.length ? `<div class="tbl"><table><tr>${cols.map(c => `<th${c.m ? ' class="hide-m"' : ""}>${c.l}</th>`).join("")}</tr>${rows.map((r, i) => `<tr class="click" data-i="${i}">${cols.map(c => `<td${c.m ? ' class="hide-m"' : ""}>${c.f(r)}</td>`).join("")}</tr>`).join("")}</table></div>` : `<div class="card empty">Nothing here yet.</div>`}`;
  if (onAdd) $("#l-add").onclick = onAdd;
  $$("tr[data-i]").forEach(tr => tr.onclick = () => onOpen(rows[+tr.dataset.i]));
  $("#l-q").oninput = e => { const q = e.target.value.toLowerCase(); $$("tr[data-i]").forEach(tr => tr.hidden = !tr.textContent.toLowerCase().includes(q)); };
}
async function circuits(){
  listPage("Circuits", D.venues, [
    { l:"Circuit", f:v => `<b>${esc(v.name)}</b>` }, { l:"Place", f:v => esc([v.city, v.country].filter(Boolean).join(", ")), m:1 }, { l:"Time zone", f:v => esc(v.timezone) }
  ], () => editVenue(), editVenue, "+ Add circuit", "Circuits are created automatically when you add a race. Edit one here if a time zone is wrong.");
}
async function editVenue(v){
  const r = await drawer(v ? v.name : "Add circuit", [
    { k:"name", l:"Circuit name", req:true },
    { row:[{ k:"city", l:"Town / region" }, { k:"country", l:"Country", req:true }] },
    { row:[{ k:"country_code", l:"Country code (flag)", ph:"FR" }, { k:"timezone", l:"Time zone", type:"select", req:true, options: TZS.map(t => ({ v:t, l:t.replace(/_/g, " ") })) }] },
    { row:[{ k:"lat", l:"Latitude", type:"number", step:"any" }, { k:"lng", l:"Longitude", type:"number", step:"any" }] }
  ], v || {}, { onDelete: !!v });
  if (!r) return;
  if (r.__delete) return guard(async () => { await del("venues", v.id); route(); }, "Deleted");
  if (r.country_code) r.country_code = r.country_code.toUpperCase();
  await guard(async () => { v ? await upd("venues", v.id, r) : await ins("venues", r); route(); }, "Circuit saved");
}
// Vehicle specs: one fixed list, used by every user page
const VFIELDS = [
  { k:"engine", l:"Engine", help:"For example: Gibson GK428 4.2 L V8, naturally aspirated" },
  { k:"hybrid", l:"Hybrid system", help:"Leave empty if there's none" },
  { k:"power", l:"Power", help:"For example: 680 hp (500 kW)" },
  { k:"max_rpm", l:"Max rpm", help:"For example: 9,000 rpm" },
  { k:"gearbox", l:"Gearbox", help:"For example: 7-speed sequential" },
  { k:"weight", l:"Weight", help:"For example: 1,030 kg" },
  { k:"dimensions", l:"Dimensions", help:"For example: 5,100 × 2,000 mm (L × W)" }
];
const DRIVE = { awd:"AWD", rwd:"RWD", fwd:"FWD" };
async function vehicles(){
  const rows = [...D.vehicles].sort((a, b) => (a.status === "pending" ? 0 : 1) - (b.status === "pending" ? 0 : 1) || a.name.localeCompare(b.name));
  listPage("Vehicles", rows, [
    { l:"Vehicle", f:v => `<b>${esc(v.name)}</b>` }, { l:"Engine", f:v => `<span class="dim">${esc(v.engine || "")}</span>`, m:1 },
    { l:"Drivetrain", f:v => esc(DRIVE[v.drivetrain] || "–"), m:1 },
    { l:"Status", f:v => v.status === "approved" ? '<span class="chip good">In catalogue</span>' : '<span class="chip warn">Added by a user · to approve</span>' }
  ], () => editVehicle(), editVehicle, "+ Add vehicle");
}
async function editVehicle(v){
  let drive = v?.drivetrain || "";
  const driveHtml = `<div><label class="f">Drivetrain</label><div class="seg" id="dv-pick" role="radiogroup" aria-label="Drivetrain">${Object.entries(DRIVE).map(([k, l]) => `<button type="button" role="radio" data-d="${k}" class="${drive === k ? "on" : ""}" aria-checked="${drive === k}">${l}</button>`).join("")}</div><div class="help">All-wheel, rear-wheel or front-wheel drive. Tap again to clear.</div></div>`;
  const r = await drawer(v ? v.name : "Add vehicle", [
    { section:"Vehicle", items:[{ k:"name", l:"Name", req:true, help:"As fans know it, for example: Cadillac V-Series.R" }] },
    { section:"Specs", sub:"Shown on every page that uses this car", items:[
      VFIELDS[0], VFIELDS[1], VFIELDS[2], { html: driveHtml },
      { row:[VFIELDS[3], VFIELDS[4]] }, { row:[VFIELDS[5], VFIELDS[6]] } ] },
    { section:"Catalogue", items:[{ k:"approved", l:"Availability", type:"bool", l2:"In the catalogue: every user can pick it" }] }
  ], { ...(v || {}), approved: v ? v.status === "approved" : true }, { onDelete: !!v, deleteText:"Delete this vehicle? Pages using it will show no car.",
    after(){ $$("#dv-pick button").forEach(b => b.onclick = () => { drive = drive === b.dataset.d ? "" : b.dataset.d; $$("#dv-pick button").forEach(x => { x.classList.toggle("on", x.dataset.d === drive); x.setAttribute("aria-checked", x.dataset.d === drive); }); }); } });
  if (!r) return;
  if (r.__delete) return guard(async () => { await del("vehicles", v.id); route(); }, "Deleted");
  const row = { name:r.name, drivetrain: drive || null, status: r.approved ? "approved" : "pending" };
  VFIELDS.forEach(f => row[f.k] = r[f.k] || null);
  await guard(async () => { v ? await upd("vehicles", v.id, row) : await ins("vehicles", row); route(); }, "Vehicle saved");
}

// ---------- start ----------
function login(msg){
  $("#app").innerHTML = `<div class="login"><div class="brand" style="font-size:40px">RACEN<span class="x">X</span>T</div><div class="muted" style="letter-spacing:.16em;text-transform:uppercase;font-size:12px;margin-top:4px">Admin</div>
    <div class="card" id="lbox" style="margin-top:20px"></div></div>`;
  rnxAuth($("#lbox"), { title: "Sign in", note: msg, onSession: s => { S.set(s); start(); } });
}
async function start(){
  readHash();
  if (!(await token())) return login();
  ME = await fetch(`${C.url}/auth/v1/user`, { headers:{ apikey:C.key, Authorization:`Bearer ${await token()}` } }).then(r => r.ok ? r.json() : null).catch(() => null);
  if (!ME){ S.set(null); return login(); }
  let isAdmin = false; try { isAdmin = await rpc("am_i_admin"); } catch(e){}
  if (!isAdmin && new URLSearchParams(location.search).get("stay") === null){ location.replace("app.html"); return; }
  if (!isAdmin){
    $("#app").innerHTML = `<div class="login"><div class="brand" style="font-size:40px">RACEN<span class="x">X</span>T</div><div class="card" style="margin-top:20px;text-align:left"><b>Signed in as ${esc(ME.email)}</b><p class="dim">This account isn't an admin yet. Share this ID with the Racenxt team to get access:</p><pre>${esc(ME.id)}</pre><button class="btn" id="lo" style="margin-top:10px">Sign out</button></div></div>`;
    $("#lo").onclick = () => { S.set(null); location.reload(); };
    return;
  }
  if (!location.hash.startsWith("#/")) history.replaceState(null, "", "#/dashboard");
  route();
}
start();
})();
