<script>
(() => {
const C = window.RNX_CONFIG;

const PAGE_BASE = location.origin + (window.RNX_BASE || "/");

// ---------- session (Supabase magic link, no library) ----------
// One session for the whole site (admin, sign-up, the athlete's page), renewed by one page at a time.
// Two copies of the same session would make the server think a key was stolen and sign the person out.
const SKEY = "rnx_sess";
const S = {
  get(){ try {
    let s = JSON.parse(localStorage.getItem(SKEY) || "null");
    if (!s){ // older copies: keep the most recent one only
      s = ["rnx_user_sess", "rnx_admin_sess"].map(k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } }).filter(Boolean).sort((a, b) => b.expires_at - a.expires_at)[0] || null;
      if (s) localStorage.setItem(SKEY, JSON.stringify(s));
    }
    localStorage.removeItem("rnx_user_sess"); localStorage.removeItem("rnx_admin_sess");
    return s;
  } catch(e){ return null; } },
  set(v){ try { v ? localStorage.setItem(SKEY, JSON.stringify(v)) : localStorage.removeItem(SKEY); } catch(e){} }
};
let refreshing = null;
async function token(){
  const s = S.get(); if (!s) return null;
  if (s.expires_at - 60 > Date.now()/1000) return s.access_token;
  if (!refreshing) refreshing = (async () => {
    const run = async () => {
      const cur = S.get(); if (!cur) return null;
      if (cur.expires_at - 60 > Date.now()/1000) return cur.access_token; // another tab already renewed it
      let r; try { r = await fetch(`${C.url}/auth/v1/token?grant_type=refresh_token`, { method:"POST", headers:{ apikey:C.key, "Content-Type":"application/json" }, body: JSON.stringify({ refresh_token: cur.refresh_token }) }); } catch(e){ return null; } // offline: stay signed in
      if (!r.ok){ const again = S.get(); if (again && again.refresh_token !== cur.refresh_token) return again.access_token; if (r.status === 400 || r.status === 401 || r.status === 403) S.set(null); return null; }
      const j = await r.json(); const n = { access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now()/1000 + j.expires_in }; S.set(n); return n.access_token;
    };
    try { return navigator.locks ? await navigator.locks.request("rnx-refresh", run) : await run(); } finally { setTimeout(() => { refreshing = null; }, 0); }
  })();
  return refreshing;
}
function readHash(){
  if (!location.hash.includes("access_token")) return;
  const h = new URLSearchParams(location.hash.slice(1));
  S.set({ access_token:h.get("access_token"), refresh_token:h.get("refresh_token"), expires_at: Date.now()/1000 + (+h.get("expires_in") || 3600) });
  history.replaceState(null, "", location.pathname);
}
async function api(path, opt = {}){
  const t = await token();
  const r = await fetch(`${C.url}/rest/v1/${path}`, { ...opt, headers:{ apikey:C.key, Authorization:`Bearer ${t || C.key}`, "Content-Type":"application/json", Prefer:"return=representation", ...(opt.headers||{}) } });
  if (!r.ok){ let m = r.status + ""; try { const j = await r.json(); m = j.message || j.hint || m; } catch(e){} throw new Error(m); }
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
const rpc = (fn, args) => api(`rpc/${fn}`, { method:"POST", body: JSON.stringify(args || {}) });
const ins = (t, row) => api(t, { method:"POST", body: JSON.stringify(row) });
const upd = (t, id, row) => api(`${t}?id=eq.${id}`, { method:"PATCH", body: JSON.stringify(row) });
async function guard(fn, okMsg){ try { await fn(); if (okMsg) toast(okMsg); return true; } catch(e){ alert("Something went wrong: " + e.message); return false; } }
async function upload(blob, path){
  const t = await token();
  const r = await fetch(`${C.url}/storage/v1/object/media/${path}`, { method:"POST", headers:{ apikey:C.key, Authorization:`Bearer ${t}`, "Content-Type": blob.type || "image/jpeg" }, body: blob });
  if (!r.ok){ let m = ""; try { m = (await r.json()).message || ""; } catch(e){} throw new Error(`upload failed (${r.status}${m ? ": " + m : ""})`); }
  return `${C.url}/storage/v1/object/public/media/${path}`;
}
// square photo, centred, 800 px
async function squarePhoto(file){
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  const s = Math.min(img.naturalWidth, img.naturalHeight), out = Math.min(800, s);
  const cv = document.createElement("canvas"); cv.width = cv.height = out;
  cv.getContext("2d").drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, out, out);
  return await new Promise(r => cv.toBlob(r, "image/jpeg", .88));
}

async function heroPhoto(file){

    let t;
    const check = () => { clearTimeout(t); const v = $("#o-slug").value.trim().toLowerCase(); OB.slug = v; OB.avail = false;
      if (!/^[a-z0-9-]{2,40}$/.test(v)){ $("#o-avail").textContent = "Letters, numbers and dashes (at least 2)."; return; }
      $("#o-avail").textContent = "Checking…";
      t = setTimeout(async () => { let ok = false; try { ok = await rpc("slug_available", { p_slug: v }); } catch(e){} if (OB.slug === v){ OB.avail = ok; $("#o-avail").innerHTML = ok ? `<span class="ok">✓ Available</span>` : `<span class="no">✗ Already taken. Try another.</span>`; } }, 350); };
    const auto = () => { OB.first = $("#o-first").value.trim(); OB.last = $("#o-last").value.trim(); if (!OB.touched){ $("#o-slug").value = slugify(OB.first && OB.last ? `${OB.first}-${OB.last}` : OB.first || OB.last); check(); } };
    $("#o-first").oninput = auto; $("#o-last").oninput = auto;
    $("#o-slug").oninput = () => { OB.touched = true; $("#o-slug").value = $("#o-slug").value.toLowerCase().replace(/[^a-z0-9-]/g, ""); check(); };
    if (OB.slug) check();
    obLogo();
    $("#ob-photo").onclick = () => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0"; document.body.appendChild(i); i.onchange = async () => { const f = i.files[0]; setTimeout(() => i.remove(), 1000); if (!f) return; obSave(); OB.photo = f; OB.photoUrl = URL.createObjectURL(f); OB.pos = (await rnxPhotoEditor(OB.photoUrl, null, `${esc((OB.first || "").toUpperCase())} <em>RACE HUB</em>`)) || { x:50, y:35, z:1 }; obStep(); }; i.click(); };
    if ($("#ob-adj")) $("#ob-adj").onclick = async () => { obSave(); const n = await rnxPhotoEditor(OB.photoUrl, OB.pos, `${esc((OB.first || "").toUpperCase())} <em>RACE HUB</em>`); if (n){ OB.pos = n; obStep(); } };
  }
  if (n === 2 && window.rnxSocialWatch) SOCIALS.forEach(s => rnxSocialWatch($("#o-" + s.k), s.k, token));
  if (n === 3) obChamps();
  $("#o-next").onclick = async () => {
    obSave();
    if (n === 1){
      if (!OB.first){ $("#o-first").focus(); return alert("Add your first name."); }
      if (!OB.last){ $("#o-last").focus(); return alert("Add your last name."); }
      if (!OB.avail){ $("#o-slug").focus(); return alert("Pick a page link that's available."); }
    }
    if (n === 2 && OB.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(OB.email)){ $("#o-mail").focus(); return alert("That contact email doesn't look right."); }
    if (n === 2 && OB.website && /@/.test(OB.website.replace(/^https?:\/\//, "").split("/")[0])){ $("#o-web").focus(); return alert("That looks like an email address. Put it in Contact email, and your website address (like louisdeletraz.com) here."); }
    if (n < 3){ OB.step++; obStep(); window.scrollTo(0, 0); return; }
    $("#o-next").disabled = true; $("#o-next").textContent = "Creating your page…";
    try {
      // a second try after an error carries on: the page and the championships already saved aren't created again
      const id = OB.createdId || (OB.createdId = await rpc("create_profile", { p_slug: OB.slug, p_display_name: `${OB.first} ${OB.last}`, p_first_name: OB.first, p_sport: "motorsport" }));
      OB.savedEntries = OB.savedEntries || new Set();
      const row = { last_name: OB.last, socials: { ...OB.socials, ...(OB.website ? { website: OB.website } : {}) }, contact_email: OB.email || null, updated_at: new Date().toISOString() };
      if (OB.photo){ let pic; try { pic = await heroPhoto(OB.photo); } catch(e){ pic = OB.photo; } row.photo_url = await upload(pic, `profiles/${id}-${Date.now()}.jpg`); if (OB.pos) row.photo_pos = OB.pos; }
      if (OB.logo?.out){ const stamp = Date.now(); if (OB.logo.src) row.logo_src_url = await upload(OB.logo.src, `profiles/${id}-logo-${stamp}-src.png`); row.logo_url = await upload(OB.logo.out, `profiles/${id}-logo-${stamp}-${OB.logo.mode}.png`); row.logo_style = OB.logo.mode; }
      await upd("profiles", id, row);
      const picked = [...OB.picked]; let ci = 0;
      for (const sid of picked){
        if (OB.savedEntries.has(sid)) { ci++; continue; }
        let yr = YEAR; try { const up = await api(`events?series_id=eq.${sid}&end_date=gte.${TODAY}&select=year&order=start_date&limit=1`); if (up[0]) yr = up[0].year; } catch(e){}
        const d = OB.det[sid] || {};
        let vehicle_id = d.vehicle?.id || null;
        if (!vehicle_id && d.newCarId) vehicle_id = d.newCarId;
        if (!vehicle_id && d.newCar) { try { const [v] = await ins("vehicles", { name: d.newCar, status: "pending", suggested: !!d.suggest, created_by_profile: id }); vehicle_id = d.newCarId = v.id; } catch(e){} }
        let car_photo_url = null;
        if (d.photo) { try { car_photo_url = await upload(await carPic(d.photo), `cars/${id}-${Date.now()}.jpg`); } catch(e){} }
        await ins("entries", { profile_id:id, series_id:sid, year:yr, category: d.category || null, vehicle_id, car_number: d.car_number || null, team: d.team || null, teammates: d.teammates || [], car_photo_url, color: COLORS[ci++ % COLORS.length] }); OB.savedEntries.add(sid);
      }
      localStorage.setItem(CUR, id);
      location.replace(PAGE_BASE + OB.slug);
    } catch(err){ alert("Couldn't create the page: " + err.message); $("#o-next").disabled = false; $("#o-next").textContent = "Create my Race Hub"; }
  };
}
// logo: small box like the photo; the editor frames it, sets the colour and previews phone / computer
function obLogo(){
  const box = $("#ob-lgw"); if (!box) return;
  const url = OB.logo ? (OB.logo.url || (OB.logo.url = URL.createObjectURL(OB.logo.out))) : "";
  box.innerHTML = `<div class="ob-lgrow"><div class="ob-lgbox">${rnxLogoThumb(url, "Your logo", OB.photoUrl, OB.pos)}</div>${url ? `<button type="button" class="ob-lgx" id="ob-lgx">Remove logo</button>` : ""}<div class="ob-lgbtns"><button type="button" class="btn sm" id="ob-lg">${url ? "Change logo" : "Add logo"}</button>${url ? `<button type="button" class="btn sm" id="ob-lgc">Adjust</button>` : ""}</div></div>`;
  const ed = o => rnxLogoEditor({ photo: OB.photoUrl, pos: OB.pos, title: `${esc((OB.first || "").toUpperCase())} <em>RACE HUB</em>`, getToken: token, ...o });
  $("#ob-lg").onclick = async () => { obSave(); const f = await obPick(); if (!f) return; const r = await ed({ file: f, mode: OB.logo?.mode || "original" }); if (r) OB.logo = { src: r.src, out: r.out, mode: r.mode }; obLogo(); };
  if ($("#ob-lgc")) $("#ob-lgc").onclick = async () => { const r = await ed({ src: OB.logo.src, current: url, mode: OB.logo.mode }); if (r) OB.logo = { src: OB.logo.src, out: r.out, mode: r.mode }; obLogo(); };
  if ($("#ob-lgx")) $("#ob-lgx").onclick = () => { OB.logo = null; obLogo(); };
}
// ---------- "Your championships": search with suggestions, your picks, popular, then A–Z ----------
let POP = null, VEHS = null;
const nextLabel = () => OB.picked.size ? `Create my Race Hub · ${OB.picked.size} championship${OB.picked.size > 1 ? "s" : ""}` : "Create my Race Hub";
const lgMini = s => `<span class="oc-lg">${s.logo_url ? `<img src="${esc(s.logo_url)}" alt="">` : `<span>${esc((s.short_name || s.name).slice(0, 5))}</span>`}</span>`;
function detLine(id){
  const d = OB.det[id] || {}, bits = [d.category, d.vehicle?.name || d.newCar, d.car_number ? "#" + d.car_number : "", d.team].filter(Boolean);
  return bits.join(" · ");
}
const ocRow = s => { const on = OB.picked.has(s.id); return `<button type="button" class="oc-row" role="checkbox" aria-checked="${on}" data-s="${s.id}">${lgMini(s)}<span class="oc-t"><b>${esc(s.name)}</b><small>${esc(on && detLine(s.id) ? detLine(s.id) : [s.short_name !== s.name ? s.short_name : "", SPORT[s.sport]?.l].filter(Boolean).join(" · "))}</small></span><i class="oc-ck" aria-hidden="true"></i></button>`; };
async function obChamps(){
  if (!POP) { POP = {}; try { (await rpc("series_popular")).forEach(r => POP[r.series_id] = r.athletes); } catch(e){} }
  const byName = [...ST.series].sort((a, b) => a.name.localeCompare(b.name));
  const fav = [...ST.series].sort((a, b) => (POP[b.id] || 0) - (POP[a.id] || 0) || a.name.localeCompare(b.name)).slice(0, 3);
  const drawAll = () => {
    let last = "", az = "";
    for (const s of byName) { const l = (s.name[0] || "#").toUpperCase(); if (l !== last) { az += `<div class="oc-l" aria-hidden="true">${esc(l)}</div>`; last = l; } az += ocRow(s); }
    $("#o-all").innerHTML = `<div class="oc-h">Popular</div><div class="oc-list">${fav.map(ocRow).join("")}</div><div class="oc-h">All championships · A–Z</div><div class="oc-list">${az}</div>`;
    const mine = byName.filter(s => OB.picked.has(s.id));
    $("#o-mine").innerHTML = mine.length ? `<div class="oc-h">Your championships</div><div class="oc-list">${mine.map(s => `<div class="oc-mine">${lgMini(s)}<span class="oc-t"><b>${esc(s.name)}</b><small>${esc(detLine(s.id) || "Tap Edit to add your class, car and number")}</small></span><button type="button" class="btn sm" data-ed="${s.id}">Edit</button><button type="button" class="oc-x" data-rm="${s.id}" aria-label="Remove ${esc(s.name)}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join("")}</div>` : "";
    bind();
  };
  const drawSug = () => {
    const q = $("#o-q").value.trim().toLowerCase(), box = $("#o-sug");
    if (!q) { box.hidden = true; box.innerHTML = ""; $("#o-all").hidden = false; return; }
    const hits = byName.filter(s => (s.name + " " + (s.short_name || "")).toLowerCase().includes(q))
      .sort((a, b) => ((b.short_name || "").toLowerCase().startsWith(q) || b.name.toLowerCase().startsWith(q)) - ((a.short_name || "").toLowerCase().startsWith(q) || a.name.toLowerCase().startsWith(q)));
    box.innerHTML = hits.length ? hits.slice(0, 12).map(ocRow).join("") : `<div class="oc-none">No championship called “${esc($("#o-q").value.trim())}” yet. Write to us and we'll add it.</div>`;
    box.hidden = false; $("#o-all").hidden = true; bind();
  };
  const toggle = async id => {
    const ser = ST.series.find(x => x.id === id);
    if (OB.picked.has(id)) { const r = await champSetup(ser, OB.det[id] || {}); if (r) OB.det[id] = r; }
    else { const r = await champSetup(ser, {}); if (!r) return; OB.picked.add(id); OB.det[id] = r; }
    $("#o-q").value = ""; drawSug(); drawAll(); $("#o-next").textContent = nextLabel();
  };
  function bind(){
    $$("[data-s]").forEach(b => b.onclick = () => toggle(b.dataset.s));
    $$("[data-ed]").forEach(b => b.onclick = () => toggle(b.dataset.ed));
    $$("[data-rm]").forEach(b => b.onclick = () => { OB.picked.delete(b.dataset.rm); delete OB.det[b.dataset.rm]; drawAll(); $("#o-next").textContent = nextLabel(); });
  }
  $("#o-q").oninput = drawSug;
  $("#o-q").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#o-sug [data-s]")?.click(); } };
  drawAll();
}

// ---------- adding a championship: class → car → number, team, teammates, car photo. Every step can be skipped. ----------
// resolves with { category, vehicle | newCar, car_number, team, teammates, photo } or null if closed
function champSetup(ser, d0){
  return new Promise(async res => {
    const d = { ...d0 }, back = document.activeElement;
    const CL = (ser.classes || []).length > 1 ? ser.classes : null;
    if (!VEHS) { try { VEHS = await api("vehicles?status=eq.approved&select=id,name,manufacturer,category&order=name"); } catch(e){ VEHS = []; } }
    let mine = []; try { mine = (await api(`series_vehicles?series_id=eq.${ser.id}&select=vehicle_id,classes`)); } catch(e){}
    const steps = [...(CL ? ["class"] : []), "car", "details"];
    let at = 0;
    const ov = document.createElement("div"); ov.className = "cls-ov";
    ov.innerHTML = `<div class="cls-box" role="dialog" aria-modal="true" aria-labelledby="cls-h"><div class="cls-top"><div><div class="cls-k">${esc(ser.short_name || ser.name)}</div><h2 id="cls-h"></h2></div><button type="button" class="cls-x" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="cs-dots" aria-hidden="true">${steps.map(() => "<i></i>").join("")}</div><div id="cs-b"></div><div class="cs-f" id="cs-f"></div></div>`;
    const close = v => { ov.remove(); document.removeEventListener("keydown", key); document.body.style.overflow = ""; back?.focus?.(); res(v); };
    const key = e => { if (e.key === "Escape") quit(); if (e.key === "Tab"){ const f = [...ov.querySelectorAll("button:not([disabled]),input")]; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); } } };
    // closing after a first answer keeps what's chosen (adding), closing right away adds nothing
    const quit = () => close(at > 0 || Object.keys(d0).length ? d : null);
    ov.onclick = e => { if (e.target === ov) quit(); };
    ov.querySelector(".cls-x").onclick = quit;
    const next = () => { at++; if (at >= steps.length) close(d); else draw(); };
    const prev = () => { if (at > 0) { at--; draw(); } };
    const foot = (skip, main) => `${at > 0 ? `<button type="button" class="btn" id="cs-back">Back</button>` : ""}<button type="button" class="btn cs-skip" id="cs-skip">${skip}</button>${main ? `<button type="button" class="btn pri" id="cs-ok">${main}</button>` : ""}`;
    function draw(){
      const st = steps[at], b = ov.querySelector("#cs-b"), f = ov.querySelector("#cs-f");
      ov.querySelectorAll(".cs-dots i").forEach((x, i) => x.classList.toggle("on", i <= at));
      if (st === "class"){
        ov.querySelector("#cls-h").textContent = "Your class";
        b.innerHTML = `<p class="muted cs-p">${ser.class_format === "separate" ? "Each class has its own sessions: your page shows only yours." : "Your page shows the races and sessions of your class."}</p><div class="cls-list">${CL.map(c => `<button type="button" class="cls-row${d.category === c ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
        f.innerHTML = foot("Skip, do it later");
        b.querySelectorAll("[data-c]").forEach(x => x.onclick = () => { d.category = x.dataset.c; next(); });
        f.querySelector("#cs-skip").onclick = () => { delete d.category; close(d); };
      }
      if (st === "car"){
        ov.querySelector("#cls-h").textContent = "Your car";
        const ids = new Set(mine.filter(m => !d.category || !(m.classes || []).length || m.classes.includes(d.category)).map(m => m.vehicle_id));
        b.innerHTML = `<div class="oc-q cs-q">${'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'}<input id="cs-q" type="search" autocomplete="off" placeholder="Search cars, e.g. ORECA 07" aria-label="Search cars"></div><div class="cls-list cs-cars" id="cs-cars"></div>`;
        const list = () => {
          const q = b.querySelector("#cs-q").value.trim().toLowerCase();
          const m = VEHS.filter(v => !q || (v.name + " " + (v.manufacturer || "")).toLowerCase().includes(q));
          const top = m.filter(v => ids.has(v.id)), rest = m.filter(v => !ids.has(v.id));
          const row = v => `<button type="button" class="cls-row${d.vehicle?.id === v.id ? " on" : ""}" data-v="${v.id}"><span>${esc(v.name)}</span>${v.category ? `<small>${esc(v.category)}</small>` : ""}</button>`;
          b.querySelector("#cs-cars").innerHTML = (top.length ? `<div class="oc-h">In ${esc(ser.short_name || ser.name)}${d.category ? " · " + esc(d.category) : ""}</div>${top.map(row).join("")}` : "")
            + (rest.length ? `${top.length ? `<div class="oc-h">All cars</div>` : ""}${rest.slice(0, q ? 30 : 12).map(row).join("")}` : "")
            + (q && !VEHS.some(v => carK(v.name) === carK(q)) ? `<button type="button" class="cls-row cs-add" id="cs-add">+ Add “${esc(b.querySelector("#cs-q").value.trim())}”<small>Not in the list: it's yours right away</small></button>` : "");
          b.querySelectorAll("[data-v]").forEach(x => x.onclick = () => { d.vehicle = VEHS.find(v => v.id === x.dataset.v); delete d.newCar; next(); });
          const add = b.querySelector("#cs-add"); if (add) add.onclick = () => { d.newCar = b.querySelector("#cs-q").value.trim(); delete d.vehicle; next(); };
        };
        b.querySelector("#cs-q").oninput = list; list();
        f.innerHTML = foot("Skip, do it later");
        f.querySelector("#cs-skip").onclick = () => { delete d.vehicle; delete d.newCar; at = steps.length; close(d); };
        setTimeout(() => b.querySelector("#cs-q").focus({ preventScroll: true }), 50);
      }
      if (st === "details"){
        ov.querySelector("#cls-h").textContent = "Your entry";
        const car = d.vehicle?.name || d.newCar;
        b.innerHTML = `<p class="muted cs-p">${car ? esc(car) : "Your car"}${d.category ? " · " + esc(d.category) : ""}</p>
          <div class="cs-two"><div class="field"><label class="f" for="cs-num">Car number</label><input id="cs-num" inputmode="numeric" autocomplete="off" value="${esc(d.car_number || "")}" enterkeyhint="next"></div>
          <div class="field"><label class="f" for="cs-team">Team</label><input id="cs-team" autocomplete="off" data-form-type="other" value="${esc(d.team || "")}" enterkeyhint="next"></div></div>
          <div class="field"><label class="f" for="cs-mates">Teammates</label><input id="cs-mates" autocomplete="off" data-form-type="other" value="${esc((d.teammates || []).join(", "))}" enterkeyhint="done"><div class="help">Separate names with commas.</div></div>
          ${d.newCar ? `<label class="cs-sug"><input type="checkbox" id="cs-sug"${d.suggest ? " checked" : ""}><span><b>Suggest this car for the Racenxt library</b><small>We'll review it and add it for everyone. Standard cars only, not modified ones. Either way, it's on your page right away.</small></span></label>` : ""}
          <div class="field"><label class="f">Car photo</label><div class="cs-ph">${d.photo ? `<img src="${esc(d.photoUrl)}" alt="">` : `<span class="muted">No photo</span>`}<button type="button" class="btn sm" id="cs-pic">${d.photo ? "Change photo" : "Add photo"}</button></div><div class="help">Your car with your livery. Fans see it when they tap your car.</div></div>`;
        f.innerHTML = foot("Skip, do it later", "Done");
        const save = () => { if (b.querySelector("#cs-sug")) d.suggest = b.querySelector("#cs-sug").checked; d.car_number = b.querySelector("#cs-num").value.trim(); d.team = b.querySelector("#cs-team").value.trim(); d.teammates = b.querySelector("#cs-mates").value.split(",").map(x => x.trim()).filter(Boolean); };
        b.querySelector("#cs-pic").onclick = async () => { save(); const fl = await obPick(); if (!fl) return; d.photo = fl; d.photoUrl = URL.createObjectURL(fl); draw(); };
        f.querySelector("#cs-ok").onclick = () => { save(); next(); };
        f.querySelector("#cs-skip").onclick = () => next();
        b.querySelector("#cs-num").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); b.querySelector("#cs-team").focus(); } };
        b.querySelector("#cs-team").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); b.querySelector("#cs-mates").focus(); } };
        b.querySelector("#cs-mates").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); save(); next(); } };
      }
      const bk = f.querySelector("#cs-back"); if (bk) bk.onclick = prev;
    }
    document.addEventListener("keydown", key); document.body.style.overflow = "hidden";
    document.body.appendChild(ov); draw();
    (ov.querySelector(".cls-row, #cs-q, #cs-num") || ov.querySelector(".cls-x")).focus({ preventScroll: true });
  });
}
// "Oreca-07" = "ORECA 07" (same rule as the library, private.vehicle_key)
const carK = t => (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "").replace(/lmgt3/g, "gt3");
// a car photo, resized for the page
async function carPic(file){
  try {
    const img = await new Promise((r, j) => { const im = new Image(); im.onload = () => r(im); im.onerror = j; im.src = URL.createObjectURL(file); });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), cv = document.createElement("canvas");
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(r, "image/jpeg", .86));
  } catch(e){ return file; }
}
const obPick = () => new Promise(res => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0"; document.body.appendChild(i); i.onchange = () => { res(i.files[0] || null); setTimeout(() => i.remove(), 1000); }; i.click(); });
function obSave(){
  if ($("#o-first")){ OB.first = $("#o-first").value.trim(); OB.last = $("#o-last").value.trim(); OB.slug = $("#o-slug").value.trim().toLowerCase(); }
  if ($("#o-web")){ SOCIALS.forEach(s => { const v = toUrl(s.k, $("#o-" + s.k).value); if (v) OB.socials[s.k] = v; else delete OB.socials[s.k]; }); OB.website = toUrl("website", $("#o-web").value); OB.email = $("#o-mail").value.trim(); }
}

// ---------- start ----------
async function boot(){
  readHash();
  if (!(await token())) return login();
  ST.me = await fetch(`${C.url}/auth/v1/user`, { headers:{ apikey:C.key, Authorization:`Bearer ${await token()}` } }).then(r => r.ok ? r.json() : null).catch(() => null);
  if (!ST.me){ S.set(null); return login("You were signed out. Sign in again."); }
  try {
    await loadMembers();
    if (!ST.profile) return onboarding(false);
    if (new URLSearchParams(location.search).has("new")) return onboarding(true);
    // your page is the editor: same page fans see, with edit controls
    location.replace(PAGE_BASE + ST.profile.slug);
  } catch(e){ shell(`<div class="empty" style="margin-top:30px">Couldn't load your page: ${esc(e.message)}<button class="btn" onclick="location.reload()">Try again</button></div>`); }
}
boot();
})();
