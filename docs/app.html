<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Racenxt · Your Race Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{--bg:#0b0c0f;--panel:#15161b;--panel2:#1b1c22;--field:#0d0e11;--line:#2a2c33;--line2:#3b3e47;--text:#f4f4f2;--dim:#a9abb2;--mute:#7d808a;--acc:#FF5A1F;--good:#5fcf6e;--warn:#f2b20f;--bad:#e8352f}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:inherit}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
  .brand{font:800 italic 26px 'Barlow Condensed',sans-serif;letter-spacing:-.4px}
  .brand .x{background:linear-gradient(90deg,var(--acc) 50%,var(--text) 50%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-right:2px}
  .top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;max-width:640px;margin:0 auto}
  .top .grow{flex:1}
  .me{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line2);background:var(--panel2) center/cover no-repeat;cursor:pointer;display:flex;align-items:center;justify-content:center;font:700 15px 'Barlow Condensed';color:var(--dim);padding:0}
  .grow{flex:1}
  h1,h2{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0}
  .btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
  .btn:hover{border-color:#50545e}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.pri:hover{background:#ff6f3a}
  .btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:10px}
  .btn.ghost{background:none}
  .btn.bad{color:var(--bad)}
  .btn.block{width:100%}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:focus-visible,input:focus,select:focus,textarea:focus,.tile:focus-visible,.pick:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  label.f{display:block;font-size:14px;font-weight:600;color:#e9e9e6;margin:0 0 6px}
  .help{font-size:13px;color:#8e919b;margin-top:5px}
  input,select,textarea{width:100%;min-height:48px;padding:11px 14px;background:var(--field);border:1px solid var(--line2);border-radius:12px;font-size:16px}
  input::placeholder{color:#5d6069}
  .field{display:grid;gap:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
  .sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
  .sec h2{font-size:20px;flex:1}
  .muted{color:var(--mute)} .dim{color:var(--dim)}
  .chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line2);color:var(--dim)}
  .chip.warn{border-color:rgba(242,178,15,.4);color:var(--warn)}
  .chip.good{border-color:rgba(95,207,110,.4);color:var(--good)}
  /* hub card */
  .hub{display:grid;gap:16px;justify-items:center;text-align:center;padding:26px 18px 20px;background:radial-gradient(120% 90% at 50% 0%,rgba(255,90,31,.14),transparent 60%),var(--panel)}
  .avatar{width:104px;height:104px;border-radius:50%;background:var(--panel2) center/cover no-repeat;border:2px solid var(--line2);position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;padding:0}
  .avatar .cam{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;border:3px solid var(--panel)}
  .avatar .cam svg{width:15px;height:15px}
  .hub h1{font-size:34px;line-height:1}
  .hub h1 span{color:var(--acc)}
  .hub{grid-template-columns:minmax(0,1fr)}
  .hub .link{justify-self:stretch;margin:0 auto;min-width:0;width:100%}
  .hub h1{font-size:clamp(26px,8.5vw,34px)!important;overflow-wrap:anywhere}
  .link{display:flex;align-items:center;gap:8px;width:100%;max-width:420px;background:var(--field);border:1px solid var(--line2);border-radius:12px;padding:6px 6px 6px 14px}
  .link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 15px Barlow;color:var(--dim);text-align:left}
  /* entries */
  .entries{display:grid;gap:10px}
  .entry{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;position:relative;overflow:hidden}
  .entry::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#8a8d96)}
  .entry:hover{border-color:var(--line2)}
  .lg{height:40px;display:flex;align-items:center;justify-content:center}
  .lg img{max-width:72px;max-height:40px;object-fit:contain}
  .lg .ph{font:700 13px 'Barlow Condensed';color:var(--dim);border:1px solid var(--line2);border-radius:8px;padding:6px 8px}
  .entry b{display:block;font-size:16px}
  .entry .meta{font-size:14px;color:var(--dim)}
  .entry .yr{font:700 15px 'Barlow Condensed';color:var(--mute)}
  .empty{border:1.5px dashed var(--line2);border-radius:18px;padding:26px 18px;text-align:center;color:var(--dim);display:grid;gap:14px;justify-items:center}
  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;z-index:41;background:#111216;border-top:1px solid var(--line2);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 50px rgba(0,0,0,.5)}
  body.sheet-on .scrim{opacity:1;pointer-events:auto}
  body.sheet-on .sheet{transform:none}
  @media (min-width:760px){.sheet{left:auto;top:0;width:520px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line2);transform:translateX(105%)}}
  @media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
  .sh-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .sh-h::before{content:"";position:absolute;left:50%;top:7px;width:38px;height:4px;border-radius:2px;background:var(--line2);transform:translateX(-50%)}
  @media (min-width:760px){.sh-h::before{display:none}}
  .sh-h b{flex:1;font:700 22px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.02em}
  .sh-x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:18px}
  .sh-b{flex:1;overflow:auto;padding:18px;display:grid;gap:16px;align-content:start}
  .sh-f{display:flex;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .sh-f .btn{flex:1}
  .sh-f .btn.bad{flex:none}
  /* championship picker */
  .picks{display:grid;gap:8px}
  .pick{display:grid;grid-template-columns:64px 1fr 24px;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
  .pick:hover{border-color:var(--line2)}
  .pick small{display:block;color:var(--mute);font-size:13px}
  .sp-ic{width:24px;max-height:14px;color:var(--mute)}
  .grp{font:700 12px Barlow;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:8px 0 2px}
  .seg{display:flex;background:var(--field);border:1px solid var(--line2);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;height:40px;border:0;border-radius:9px;background:none;color:var(--dim);font-weight:700;cursor:pointer}
  .seg button[aria-checked="true"]{background:var(--acc);color:#fff}
  .swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .sw{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
  .sw[aria-checked="true"]{border-color:var(--text);transform:scale(1.08)}
  .sw-custom{width:38px;height:38px;padding:0;border-radius:50%;overflow:hidden;min-height:0;border:2px dashed var(--line2);background:none;cursor:pointer}
  /* vehicle picker */
  .vp{position:relative}
  .vp-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:6px;max-height:260px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .vp-list button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:none;cursor:pointer}
  .vp-list button:hover,.vp-list button:focus-visible{background:var(--panel)}
  .vp-list small{color:var(--mute)}
  .vchip{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--field);border:1px solid var(--line2);border-radius:12px}
  .vchip b{flex:1}
  .menu{position:fixed;right:16px;top:calc(60px + env(safe-area-inset-top));z-index:45;min-width:240px;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
  .menu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left}
  .menu button:hover{background:var(--panel)}
  .menu .on::after{content:"✓";margin-left:auto;color:var(--acc)}
  .menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:#0b0c0f;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
  .toast.on{opacity:1}
  .center{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .auth{width:100%;max-width:400px;display:grid;gap:18px;text-align:center}
  .auth .card{text-align:left;display:grid;gap:14px}
  .ok{color:var(--good)} .no{color:var(--bad)}
  .steps{display:flex;gap:6px;justify-content:center}
  .steps i{width:28px;height:4px;border-radius:2px;background:var(--line2)} .steps i.on{background:var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sh-h"><b id="sh-t"></b><button class="sh-x" id="sh-x" aria-label="Close">×</button></div><div class="sh-b" id="sh-b"></div><div class="sh-f" id="sh-f"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
const C = window.RNX_CONFIG;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2400); };
const YEAR = new Date().getFullYear(), TODAY = new Date().toISOString().slice(0, 10);
const PAGE_BASE = location.origin + (window.RNX_BASE || "/");
const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const SPORT = {
  sportscars:{ l:"Sportscars", i:'<svg class="sp-ic" viewBox="-0.6 0.1 23.4 6.8" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round"><path stroke-width="0.95" d="M0.3 5.1 L0.8 3.7 Q1.3 2.9 2.6 2.6 Q4.2 2.2 5.6 2.4 L6.7 2.5 L8.7 0.95 Q9.1 0.75 9.8 0.75 L11.4 0.75 Q12.6 0.8 13.6 1.5 L15.6 2.3 Q16.6 2.4 17.6 2.4 L21.9 2.8 L21.9 5.1 L20.5 5.1 A2.05 2.05 0 0 0 16.4 5.1 L7.3 5.1 A2.05 2.05 0 0 0 3.2 5.1 Z"/><path stroke-width="0.7" d="M11.6 0.8 L20.4 1.05 M20.2 1.05 L22.3 0.95 M21.9 1 L21.9 2.8"/><circle stroke-width="0.95" cx="5.25" cy="5.15" r="1.4"/><circle stroke-width="0.95" cx="18.45" cy="5.15" r="1.4"/></svg>' },
  formula:{ l:"Formula", i:'<svg class="sp-ic" viewBox="-0.6 0.1 23.6 7.3" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round"><path stroke-width="0.95" d="M0.2 5.4 L2.6 5.4 M2.4 4.6 L6.4 4 L8.8 3.5 L10 2.9 L12.6 2.5 Q15.4 2.3 17.2 3.1 L19.8 4 L19.8 5.1"/><path stroke-width="0.95" d="M6.2 5.3 L16.4 5.3"/><path stroke-width="0.8" d="M9.7 3.1 Q10.8 1.7 12.4 2.5"/><path stroke-width="0.8" d="M19.9 1.2 L22.6 1.2 M22.3 1.2 L22.3 4.7 M20.8 1.2 L21.1 4"/><circle stroke-width="0.95" cx="4.4" cy="5" r="1.65"/><circle stroke-width="0.95" cx="18.1" cy="5" r="1.65"/></svg>' },
  motorbikes:{ l:"Motorbikes", i:'<svg class="sp-ic" viewBox="-0.4 -0.2 14 8.2" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round"><circle stroke-width="0.85" cx="2.5" cy="5.2" r="2"/><circle stroke-width="0.85" cx="11" cy="5.2" r="2"/><path stroke-width="0.85" d="M2.5 5.2 L4.3 1.4 M3.6 1.4 L5.2 1.4"/><path stroke-width="0.85" d="M4.6 2.3 Q6 1.4 7.6 1.8 L9.2 2.1 L11.6 1.3 M4.9 3.6 L8.6 3.3 L11 5.2 M6 5.2 L8.6 3.3"/></svg>' }
};
const COLORS = ["#FF5A1F","#E8352F","#F2B20F","#5FCF6E","#1FB5A8","#2F80ED","#7B61FF","#D946EF","#F4F4F2","#8A8D96"];
const VFIELDS = [
  { k:"engine", l:"Engine", ph:"Gibson GK428 4.2 L V8" },
  { k:"hybrid", l:"Hybrid system", ph:"Leave empty if none" },
  { k:"power", l:"Power", ph:"680 hp" },
  { k:"max_rpm", l:"Max rpm", ph:"9,000 rpm" },
  { k:"gearbox", l:"Gearbox", ph:"7-speed sequential" },
  { k:"weight", l:"Weight", ph:"1,030 kg" },
  { k:"dimensions", l:"Dimensions", ph:"5,100 × 2,000 mm" }
];
const DRIVE = { awd:"AWD", rwd:"RWD", fwd:"FWD" };

// ---------- session (Supabase magic link, no library) ----------
const KEY = "rnx_user_sess";
const S = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY) || localStorage.getItem("rnx_admin_sess") || "null"); } catch(e){ return null; } },
  set(v){ try { v ? localStorage.setItem(KEY, JSON.stringify(v)) : (localStorage.removeItem(KEY), localStorage.removeItem("rnx_admin_sess")); } catch(e){} }
};
function readHash(){
  if (!location.hash.includes("access_token")) return;
  const h = new URLSearchParams(location.hash.slice(1));
  S.set({ access_token:h.get("access_token"), refresh_token:h.get("refresh_token"), expires_at: Date.now()/1000 + (+h.get("expires_in") || 3600) });
  history.replaceState(null, "", location.pathname);
}
async function token(){
  let s = S.get(); if (!s) return null;
  if (s.expires_at - 60 < Date.now()/1000){
    const r = await fetch(`${C.url}/auth/v1/token?grant_type=refresh_token`, { method:"POST", headers:{ apikey:C.key, "Content-Type":"application/json" }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    if (!r.ok){ S.set(null); return null; }
    const j = await r.json(); s = { access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now()/1000 + j.expires_in }; S.set(s);
  }
  return s.access_token;
}
async function api(path, opt = {}){
  const t = await token();
  const r = await fetch(`${C.url}/rest/v1/${path}`, { ...opt, headers:{ apikey:C.key, Authorization:`Bearer ${t || C.key}`, "Content-Type":"application/json", Prefer:"return=representation", ...(opt.headers||{}) } });
  if (!r.ok){ let m = r.status + ""; try { const j = await r.json(); m = j.message || j.hint || m; } catch(e){} throw new Error(m); }
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
const rpc = (fn, args) => api(`rpc/${fn}`, { method:"POST", body: JSON.stringify(args || {}) });
const ins = (t, row) => api(t, { method:"POST", body: JSON.stringify(row) });
const upd = (t, id, row) => api(`${t}?id=eq.${id}`, { method:"PATCH", body: JSON.stringify(row) });
async function guard(fn, okMsg){ try { await fn(); if (okMsg) toast(okMsg); return true; } catch(e){ alert("Something went wrong: " + e.message); return false; } }
async function upload(blob, path){
  const t = await token();
  const r = await fetch(`${C.url}/storage/v1/object/media/${path}`, { method:"POST", headers:{ apikey:C.key, Authorization:`Bearer ${t}`, "Content-Type": blob.type || "image/jpeg" }, body: blob });
  if (!r.ok){ let m = ""; try { m = (await r.json()).message || ""; } catch(e){} throw new Error(`upload failed (${r.status}${m ? ": " + m : ""})`); }
  return `${C.url}/storage/v1/object/public/media/${path}`;
}
// square photo, centred, 800 px
async function squarePhoto(file){
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  const s = Math.min(img.naturalWidth, img.naturalHeight), out = Math.min(800, s);
  const cv = document.createElement("canvas"); cv.width = cv.height = out;
  cv.getContext("2d").drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, out, out);
  return await new Promise(r => cv.toBlob(r, "image/jpeg", .88));
}

// ---------- bottom sheet ----------
let sheetResolve = null;
function closeSheet(v){ document.body.classList.remove("sheet-on"); if (sheetResolve){ const r = sheetResolve; sheetResolve = null; r(v); } }
$("#sh-x").onclick = () => closeSheet(null);
$("#scrim").onclick = () => closeSheet(null);
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("sheet-on")) closeSheet(null); });
function sheet(title, html, opts = {}){
  return new Promise(resolve => {
    sheetResolve = resolve;
    $("#sh-t").textContent = title;
    $("#sh-b").innerHTML = html;
    $("#sh-f").innerHTML = opts.footer === false ? "" : `${opts.del ? `<button class="btn bad" id="sh-del">${esc(opts.del)}</button>` : ""}<button class="btn" id="sh-cancel">Cancel</button><button class="btn pri" id="sh-ok">${esc(opts.ok || "Save")}</button>`;
    $("#sh-f").hidden = opts.footer === false;
    if ($("#sh-cancel")) $("#sh-cancel").onclick = () => closeSheet(null);
    if ($("#sh-ok")) $("#sh-ok").onclick = () => { const v = opts.collect ? opts.collect() : true; if (v) closeSheet(v); };
    if ($("#sh-del")) $("#sh-del").onclick = () => { if (confirm(opts.delText || "Delete this?")) closeSheet({ __delete:true }); };
    document.body.classList.add("sheet-on");
    $("#sh-b").scrollTop = 0;
    if (opts.after) opts.after();
    setTimeout(() => { const f = $("#sh-b input:not([type=color]):not([type=file])"); if (f && opts.focus !== false && matchMedia("(min-width:760px)").matches) f.focus(); }, 250);
  });
}
const need = (sel, msg) => { const el = $(sel); if (el && !el.value.trim()){ el.focus(); alert(msg); return false; } return true; };

// ---------- state ----------
const ST = { me:null, members:[], profile:null, role:null, series:[], entries:[], vehicles:[] };
const CUR = "rnx_profile";
async function loadMembers(){
  ST.members = await api(`profile_members?user_id=eq.${ST.me.id}&select=role,profiles(*)&order=created_at`);
  const want = localStorage.getItem(CUR);
  const m = ST.members.find(x => x.profiles?.id === want) || ST.members[0];
  ST.profile = m?.profiles || null; ST.role = m?.role || null;
}
const hubTitle = p => `${esc((p.first_name || p.display_name || "").toUpperCase())} <span>RACE HUB</span>`;

// ---------- screens ----------
function shell(inner){
  const p = ST.profile;
  $("#app").innerHTML = `<div class="top"><div class="brand">RACEN<span class="x">X</span>T</div><span class="grow"></span>${ST.me ? `<button class="me" id="me" aria-label="Profiles and account" style="${p?.photo_url ? `background-image:url('${esc(p.photo_url)}')` : ""}">${p?.photo_url ? "" : esc(((p?.first_name || ST.me.email || "?")[0] || "?").toUpperCase())}</button>` : ""}</div><div class="wrap" id="main">${inner}</div>`;
  if ($("#me")) $("#me").onclick = openMenu;
}
function openMenu(e){
  e.stopPropagation();
  if ($(".menu")){ $(".menu").remove(); return; }
  const m = document.createElement("div"); m.className = "menu"; m.setAttribute("role", "menu");
  m.innerHTML = `${ST.members.map(x => `<button role="menuitem" data-p="${x.profiles.id}" class="${x.profiles.id === ST.profile?.id ? "on" : ""}">${esc(x.profiles.display_name)}<small class="muted">${x.role === "editor" ? "· editor" : ""}</small></button>`).join("")}<hr><button role="menuitem" id="m-new">+ Create another page</button><button role="menuitem" id="m-out">Sign out</button><div class="muted" style="font-size:12px;padding:6px 12px">${esc(ST.me.email)}</div>`;
  document.body.appendChild(m);
  m.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { localStorage.setItem(CUR, b.dataset.p); m.remove(); boot(); });
  $("#m-new").onclick = () => { m.remove(); onboarding(true); };
  $("#m-out").onclick = () => { S.set(null); localStorage.removeItem(CUR); location.reload(); };
  setTimeout(() => document.addEventListener("click", function off(ev){ if (!m.contains(ev.target)){ m.remove(); document.removeEventListener("click", off); } }), 0);
}

function login(msg){
  $("#app").innerHTML = `<div class="center"><div class="auth"><div class="brand" style="font-size:46px">RACEN<span class="x">X</span>T</div><div class="dim">Everything in one place</div>
    <form class="card" id="lf"><h2 style="font-size:24px">Your Race Hub</h2><div class="dim" style="font-size:15px">One page for your season: calendar, schedules, where to watch, your car and partners. Kept up to date for you.</div>
    <div class="field"><label class="f" for="em">Email</label><input id="em" type="email" required autocomplete="email" inputmode="email"></div>
    <button class="btn pri block">Send me a sign-in link</button><div class="muted" style="font-size:14px" id="lmsg">${esc(msg || "No password: we email you a link.")}</div></form></div></div>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    const email = $("#em").value.trim();
    const r = await fetch(`${C.url}/auth/v1/otp?redirect_to=${encodeURIComponent(location.origin + location.pathname)}`, { method:"POST", headers:{ apikey:C.key, "Content-Type":"application/json" }, body: JSON.stringify({ email, create_user:true }) });
    $("#lmsg").innerHTML = r.ok ? `<span class="ok">Check your inbox:</span> we sent a link to ${esc(email)}.` : "Couldn't send the link. Try again in a minute.";
  };
}

const slugify = t => (t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
function onboarding(another){
  shell(`<div style="display:grid;gap:18px;margin-top:10px">
    <div class="steps" aria-hidden="true"><i class="on"></i><i></i></div>
    <div style="text-align:center"><h1 style="font-size:34px">${another ? "Another Race Hub" : "Create your Race Hub"}</h1><div class="dim" style="margin-top:6px">Your page for fans. You'll add your championships next.</div></div>
    <form class="card" id="ob" style="display:grid;gap:16px" novalidate>
      <div class="two"><div class="field"><label class="f" for="o-first">First name</label><input id="o-first" autocomplete="given-name" required></div><div class="field"><label class="f" for="o-last">Last name</label><input id="o-last" autocomplete="family-name" required></div></div>
      <div class="field"><label class="f" for="o-slug">Page link</label><div class="link" style="max-width:none;padding:0 0 0 14px"><code style="flex:none;color:var(--mute)">${esc(PAGE_BASE.replace(/^https?:\/\//, ""))}</code><input id="o-slug" style="border:0;background:none;padding-left:2px" autocapitalize="off" autocomplete="off" spellcheck="false" required></div><div class="help" id="o-avail">Letters, numbers and dashes.</div></div>
      <div style="text-align:center;font:700 22px 'Barlow Condensed';letter-spacing:.02em" id="o-prev"></div>
      <button class="btn pri block" id="o-go">Create my page</button>
      ${another ? `<button type="button" class="btn ghost block" id="o-back">Back</button>` : ""}
    </form></div>`);
  let touched = false, avail = false, t;
  const check = () => { clearTimeout(t); const v = $("#o-slug").value.trim().toLowerCase(); avail = false;
    if (!/^[a-z0-9-]{2,40}$/.test(v)){ $("#o-avail").innerHTML = "Letters, numbers and dashes (at least 2)."; return; }
    $("#o-avail").textContent = "Checking…";
    t = setTimeout(async () => { try { avail = await rpc("slug_available", { p_slug: v }); } catch(e){ avail = false; } if ($("#o-slug").value.trim().toLowerCase() === v) $("#o-avail").innerHTML = avail ? `<span class="ok">✓ Available</span>` : `<span class="no">✗ Already taken. Try another.</span>`; }, 350); };
  const auto = () => { const f = $("#o-first").value.trim(), l = $("#o-last").value.trim();
    $("#o-prev").innerHTML = f ? `${esc(f.toUpperCase())} <span style="color:var(--acc)">RACE HUB</span>` : "";
    if (!touched){ $("#o-slug").value = slugify(f && l ? `${f}-${l}` : f || l); check(); } };
  $("#o-first").oninput = auto; $("#o-last").oninput = auto;
  $("#o-slug").oninput = () => { touched = true; $("#o-slug").value = $("#o-slug").value.toLowerCase().replace(/[^a-z0-9-]/g, ""); check(); };
  if ($("#o-back")) $("#o-back").onclick = () => history.back();
  $("#ob").onsubmit = async e => {
    e.preventDefault();
    if (!need("#o-first", "Add your first name.") || !need("#o-last", "Add your last name.")) return;
    const slug = $("#o-slug").value.trim().toLowerCase();
    if (!avail){ alert("Pick a page link that's available."); $("#o-slug").focus(); return; }
    $("#o-go").disabled = true; $("#o-go").textContent = "Creating…";
    try {
      const id = await rpc("create_profile", { p_slug: slug, p_display_name: `${$("#o-first").value.trim()} ${$("#o-last").value.trim()}`, p_first_name: $("#o-first").value.trim(), p_sport: "motorsport" });
      localStorage.setItem(CUR, id); toast("Your Race Hub is ready");
      location.replace(PAGE_BASE + slug);
    } catch(err){ alert("Couldn't create the page: " + err.message); $("#o-go").disabled = false; $("#o-go").textContent = "Create my page"; }
  };
}

// ---------- start ----------
async function boot(){
  readHash();
  if (!(await token())) return login();
  ST.me = await fetch(`${C.url}/auth/v1/user`, { headers:{ apikey:C.key, Authorization:`Bearer ${await token()}` } }).then(r => r.ok ? r.json() : null).catch(() => null);
  if (!ST.me){ S.set(null); return login("Your link expired. Send yourself a new one."); }
  try {
    await loadMembers();
    if (!ST.profile) return onboarding(false);
    if (new URLSearchParams(location.search).has("new")) return onboarding(true);
    // your page is the editor: same page fans see, with edit controls
    location.replace(PAGE_BASE + ST.profile.slug);
  } catch(e){ shell(`<div class="empty" style="margin-top:30px">Couldn't load your page: ${esc(e.message)}<button class="btn" onclick="location.reload()">Try again</button></div>`); }
}
boot();
})();
</script>
