<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racenxt – Everything in one place</title>
<meta name="description" content="Race Hub pages for athletes: calendar, schedules, where to watch, car and sponsors, in one link fans can open anywhere.">
<meta name="theme-color" content="#0B0C0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&display=swap" rel="stylesheet">
<style>
  :root{--acc:#FF5A1F;--ink:#F4F4F2;--bg:#0B0C0F;--dim:#A9ABB2;--line:#26282e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;text-align:center;padding:40px 20px calc(28px + env(safe-area-inset-bottom))}
  .logo{font:800 italic clamp(58px,15vw,120px)/1 'Barlow Condensed',sans-serif;letter-spacing:-2px}
  .logo .x{background:linear-gradient(90deg,var(--acc) 50%,var(--ink) 50%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-right:4px}
  .tag{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;font:600 clamp(13px,3.2vw,18px) 'Barlow Condensed';letter-spacing:.32em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
  @media (max-width:420px){.tag{letter-spacing:.2em;gap:10px}.tag i{width:20px}}
  .tag i{width:30px;height:3px;background:var(--acc)}
  .box{width:100%;max-width:400px;margin-top:clamp(32px,7vh,56px)}
  .me{display:grid;gap:12px;text-align:left}
  .me-h{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #2a2d35;border-radius:16px;background:#14151a}
  .me-h i{width:42px;height:42px;flex:none;border-radius:50%;background:#22242b center/cover;display:grid;place-items:center;font:700 16px Barlow;font-style:normal;color:#cfd0d4}
  .me-h span{display:grid;min-width:0} .me-h small{color:#8e919b;font-size:13px} .me-h b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .b{height:50px;border-radius:12px;border:1px solid #33363e;background:#1b1c22;color:var(--ink);font:700 16px Barlow,system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
  .b.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  .lnk{background:none;border:0;color:#8e919b;font:600 14px Barlow,sans-serif;cursor:pointer;padding:8px;justify-self:center}
  .lnk:hover{color:var(--ink)}
  footer{margin-top:36px;font-size:13px;color:#6e7179}
  footer a{color:#6e7179;text-decoration:none} footer a:hover{color:var(--dim)}
</style>
<script src="config.js?v=20261125-010935"></script>
<script src="rnx-auth.js?v=20261125-010935"></script>
</head>
<body>
  <div class="logo" role="img" aria-label="Racenxt">RACEN<span class="x">X</span>T</div>
  <div class="tag"><i></i>Everything in one place<i></i></div>
  <main class="box" id="box"></main>
  <footer><a href="admin.html">Admin</a></footer>
<script>
(() => {
  const C = window.RNX_CONFIG, box = document.getElementById("box"), KEY = "rnx_sess";
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const get = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } };
  const set = v => { try { v ? localStorage.setItem(KEY, JSON.stringify(v)) : localStorage.removeItem(KEY); } catch (e) {} };
  const H = { apikey: C.key, "Content-Type": "application/json" };
  // a valid access token for the saved session, renewed if it has expired (null: not signed in)
  async function token() {
    const s = get(); if (!s) return null;
    if (s.expires_at - 60 > Date.now() / 1000) return s.access_token;
    try {
      const r = await fetch(`${C.url}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: H, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if (!r.ok) { if ([400, 401, 403].includes(r.status)) set(null); return null; }
      const j = await r.json(); set({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() / 1000 + j.expires_in }); return j.access_token;
    } catch (e) { return s.access_token; }
  }
  function signIn(note) {
    rnxAuth(box, { simple: true, mode: /[?&]new\b/.test(location.search) ? "signup" : "signin", note, onSession: s => { set(s); location.href = "app.html"; } });
  }
  // already signed in: say who, and let them choose (no silent sign-in, no new page by accident)
  async function signedIn(t) {
    const u = await fetch(`${C.url}/auth/v1/user`, { headers: { ...H, Authorization: `Bearer ${t}` } }).then(r => r.ok ? r.json() : null).catch(() => null);
    if (!u) { set(null); return signIn(); }
    let pages = [];
    try { pages = await fetch(`${C.url}/rest/v1/profile_members?user_id=eq.${u.id}&select=profiles(id,slug,display_name,photo_url,hero_url)&order=created_at`, { headers: { ...H, Authorization: `Bearer ${t}` } }).then(r => r.ok ? r.json() : []); } catch (e) {}
    const p = (pages[0] || {}).profiles, ph = p && (p.photo_url || p.hero_url);
    box.innerHTML = `<div class="me">
      <div class="me-h"><i style="${ph ? `background-image:url('${esc(ph)}')` : ""}">${ph ? "" : esc((u.email || "?")[0].toUpperCase())}</i><span><small>Signed in as</small><b>${esc(u.email || "")}</b></span></div>
      ${p ? `<a class="b pri" href="app.html">Open ${esc(p.display_name)}’s page</a>` : `<a class="b pri" href="app.html">Create your Race Hub</a>`}
      ${p ? `<a class="b" href="app.html?new=1">Create another page</a>` : ""}
      <button type="button" class="lnk" id="out">Not you? Sign out</button></div>`;
    document.getElementById("out").onclick = () => { set(null); try { localStorage.removeItem("rnx_profile"); } catch (e) {} signIn("Signed out."); };
  }
  token().then(t => t ? signedIn(t) : signIn());
})();
</script>
</body>
</html>
