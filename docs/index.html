<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racenxt – Everything in one place</title>
<meta name="description" content="Race Hub pages for athletes: calendar, schedules, where to watch, car and sponsors, in one link fans can open anywhere.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:ital,wght@0,600;1,800&display=swap" rel="stylesheet">
<style>
  :root{--acc:#FF5A1F;--ink:#F4F4F2;--bg:#0B0C0F;--dim:#A9ABB2;--line:#26282e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;text-align:center;padding:32px 20px}
  .logo{font:800 italic clamp(64px,16vw,150px)/1 'Barlow Condensed',sans-serif;letter-spacing:-2px}
  .logo .x{background:linear-gradient(90deg,var(--acc) 50%,var(--ink) 50%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-right:4px}
  .tag{display:flex;align-items:center;gap:14px;margin-top:18px;font:600 clamp(15px,3.6vw,22px) 'Barlow Condensed';letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
  .tag i{width:36px;height:3px;background:var(--acc)}
  .feat{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,4vw,34px);margin-top:44px}
  .f{display:flex;flex-direction:column;align-items:center;gap:10px;width:96px}
  .f span:first-child{width:60px;height:60px;border-radius:17px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .f svg{width:28px;height:28px}
  .f span:last-child{font:600 15px 'Barlow Condensed';letter-spacing:.12em;text-transform:uppercase;color:#C9CBD1}
  p{max-width:520px;color:var(--dim);margin:40px auto 0}
  footer{margin-top:40px;font-size:13px;color:#6e7179}
  footer a{color:#8d9099}
</style>
</head>
<body>
  <div class="logo" role="img" aria-label="Racenxt">RACEN<span class="x">X</span>T</div>
  <div class="tag"><i></i>Everything in one place<i></i></div>
  <div class="feat" aria-hidden="true">
    <div class="f"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><span>Calendar</span></div>
    <div class="f"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><span>Schedule</span></div>
    <div class="f"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M10 8l5 2.5-5 2.5z M8 21h8"/></svg></span><span>Watch</span></div>
    <div class="f"><span><svg viewBox="-0.6 0.1 23.4 6.6" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" style="width:36px"><path stroke-width="0.8" d="M0.3 5.1 L0.8 3.7 Q1.3 2.9 2.6 2.6 Q4.2 2.2 5.6 2.4 L6.7 2.5 L8.7 0.95 Q9.1 0.75 9.8 0.75 L11.4 0.75 Q12.6 0.8 13.6 1.5 L15.6 2.3 Q16.6 2.4 17.6 2.4 L21.9 2.8 L21.9 5.1 L20.5 5.1 A2.05 2.05 0 0 0 16.4 5.1 L7.3 5.1 A2.05 2.05 0 0 0 3.2 5.1 Z"/><circle stroke-width="0.8" cx="5.25" cy="5.15" r="1.4"/><circle stroke-width="0.8" cx="18.45" cy="5.15" r="1.4"/></svg></span><span>Car</span></div>
    <div class="f"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/></svg></span><span>Social</span></div>
  </div>
  <p>Every athlete gets one link with their season: race weekends, live schedules in each fan's time zone, where to watch, their car and their partners.</p>
  <footer>Coming soon · <a href="admin.html">Admin</a></footer>
</body>
</html>
